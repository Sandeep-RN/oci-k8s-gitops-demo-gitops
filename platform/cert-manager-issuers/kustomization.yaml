apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace field: the Application's destination (cert-manager) supplies it,
# and ClusterIssuers find their Cloudflare token Secret there.
#
# cloudflare-api-token-sealedsecret.yaml is added to this list by
# scripts/seal-cloudflare-token.sh, run by the owner. Until then both issuers
# exist but cannot get certificates (not Ready). Keep `resources` the last key.
resources:
  - clusterissuers.yaml
