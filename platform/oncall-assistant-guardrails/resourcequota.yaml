# The hard cap for the whole namespace (ADR 0025): 1 GiB of memory and 1 CPU,
# summed over every pod in it. It is what protects the live link shortener, no
# matter how the tenant misbehaves, so it lives here (platform-owned) and the
# tenant's AppProject may not touch it.
#
# The planned pods add up to exactly the cap at peak (app 320Mi + Postgres
# 256Mi + index Job 384Mi + DB role Job 64Mi = 1024Mi; CPU limits 300m + 200m +
# 450m + 50m = 1; tuned in demo #195 from measured peaks, and CI checks the
# sums against this file), so there is NO headroom: a pod that is
# not in the plan, or a Job that starts while a terminating pod still counts,
# is refused with "exceeded quota". That is the intent (a refusal beats an OOM
# on the shared node), and it is why the app uses strategy Recreate and the
# CronJob uses concurrencyPolicy Forbid. Raising the cap is an ADR change.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-cap
spec:
  hard:
    limits.memory: 1Gi
    limits.cpu: "1"
    # Requests may never exceed the limits. Memory requests equal limits by
    # design; the CPU request per container is set below its limit (#195).
    requests.memory: 1Gi
    requests.cpu: "1"
