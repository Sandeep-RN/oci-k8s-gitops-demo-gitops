# promtool unit tests for PostgresBackupMissing (apps/link-shortener/base/slo-rules.yaml).
# kube_cronjob_status_last_successful_time is a Unix timestamp; promtool's clock
# starts at 0, so a value of 0 means "the last success was at test start".
rule_files:
  - slo-redirect.rules.yaml

evaluation_interval: 1m

tests:
  # Last success at t=0 and none since: quiet at 25 h, firing after 26 h + 15m.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="link-shortener",cronjob="postgres-backup"}'
        values: '0x1680'
    alert_rule_test:
      - eval_time: 25h
        alertname: PostgresBackupMissing
        exp_alerts: []
      - eval_time: 27h
        alertname: PostgresBackupMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: link-shortener
              cronjob: postgres-backup
            exp_annotations: &annotations
              summary: No successful Postgres backup in the last 26 hours.
              description: The nightly postgres-backup CronJob has not completed successfully for more than a day. Check the last Job's logs in namespace link-shortener.
              runbook_url: https://github.com/Sandeep-RN/oci-k8s-gitops-demo/blob/main/docs/runbooks/postgres-backup-restore.md

  # A nightly success (the timestamp jumps every 24 h): never fires.
  - interval: 1h
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="link-shortener",cronjob="postgres-backup"}'
        values: '0x23 86400x23 172800x23'
    alert_rule_test:
      - eval_time: 70h
        alertname: PostgresBackupMissing
        exp_alerts: []

  # The success record disappears (CronJob deleted): fires 15m after it is gone.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="link-shortener",cronjob="postgres-backup"}'
        values: '0x60'
      - series: 'up{job="unrelated"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 70m
        alertname: PostgresBackupMissing
        exp_alerts: []
      - eval_time: 100m
        alertname: PostgresBackupMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: link-shortener
              cronjob: postgres-backup
            exp_annotations: *annotations

  # Never succeeded (no series at all): fires once the 15m "for" has passed.
  - interval: 1m
    input_series:
      - series: 'up{job="unrelated"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresBackupMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: link-shortener
              cronjob: postgres-backup
            exp_annotations: *annotations
