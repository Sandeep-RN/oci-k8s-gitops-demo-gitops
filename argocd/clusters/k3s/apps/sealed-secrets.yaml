apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Before workload apps, so their SealedSecrets have a controller to decrypt them.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # "default", not "demo": the controller is cluster-scoped (CRD, ClusterRole)
  # and lives in kube-system, which the workload project deliberately forbids.
  project: default
  source:
    repoURL: https://github.com/Sandeep-RN/oci-k8s-gitops-demo-gitops.git
    targetRevision: main
    path: platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
