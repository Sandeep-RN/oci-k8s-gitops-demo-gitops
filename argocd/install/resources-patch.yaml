# Requests and limits for ArgoCD's workloads (upstream sets none, so every pod
# was QoS BestEffort: invisible to the scheduler and first to be evicted when
# the node runs short of memory).
#
# Sizes come from `kubectl top` and Prometheus on the k3s node (2 OCPU / 12 GB),
# peaks over about 10 hours on 2026-11-21 (issue demo #190):
#   application-controller 518Mi, repo-server 80Mi, server 43Mi,
#   applicationset 25Mi, notifications 26Mi, dex ~17Mi, redis ~11Mi.
# Memory request ~ the observed peak (small pods: a round floor of 32Mi);
# memory limit ~ 2x the peak or more. The repo-server gets 512Mi because it
# renders Helm charts and Kustomize bases, which spikes above its idle use.
#
# No CPU limits on purpose: on 2 OCPU a CPU limit throttles a sync for no
# gain; CPU requests are small (actual use is 1-10m).
#
# Init containers (copyutil, secret-init) are left alone: they run for
# seconds, and the scheduler counts the larger of the init and app sums.
#
# Re-check after a few weeks: a limit that is too tight shows up as OOMKilled
# restarts of the application-controller during a sync.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-application-controller
          resources:
            requests: {cpu: 50m, memory: 512Mi}
            limits: {memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      containers:
        - name: dex
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-applicationset-controller
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-notifications-controller
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
