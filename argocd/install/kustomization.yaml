apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Upstream non-HA install, pinned. Upgrading ArgoCD = changing this version in
# a PR; ArgoCD then syncs its own new version (see clusters/*/apps/argocd.yaml).
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
