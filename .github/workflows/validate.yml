name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      # sha256 of kubeconform-linux-amd64.tar.gz from the release's CHECKSUMS file
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      K8S_VERSION: 1.31.0
      HELM_VERSION: v4.3.0
      # sha256 of helm-<version>-linux-amd64.tar.gz from get.helm.sh
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      PROMETHEUS_VERSION: 3.15.0
      # sha256 of prometheus-<version>.linux-amd64.tar.gz from the release's sha256sums.txt
      PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
      # Same version as the chart's Alertmanager image
      ALERTMANAGER_VERSION: 0.34.1
      # sha256 of alertmanager-<version>.linux-amd64.tar.gz from the release's sha256sums.txt
      ALERTMANAGER_SHA256: 265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeconform (checksum verified)
        run: |
          curl -fsSL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar -xzf kc.tgz kubeconform

      - name: Install Helm (checksum verified)
        run: |
          curl -fsSL -o helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm

      # Render every overlay and the ArgoCD install exactly as ArgoCD would, then
      # check the result against the Kubernetes schemas plus the community CRD
      # catalog (for Application/AppProject). A broken manifest fails here, not
      # in the cluster.
      - name: Render and validate
        env:
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          # CustomResourceDefinition has no published schema; the only CRDs here
          # are ArgoCD's own, taken unmodified from the pinned upstream install.
          kc_args=(-strict -summary -kubernetes-version "${K8S_VERSION}"
                   -schema-location default -schema-location "${CRD_SCHEMAS}"
                   -skip CustomResourceDefinition)
          kc() { ./kubeconform "${kc_args[@]}" "$@"; }
          dirs=(apps/*/overlays/*/ argocd/install/ platform/*/)
          # monitoring/ also holds Helm values folders, which are not kustomizations.
          for k in monitoring/*/kustomization.yaml; do dirs+=("$(dirname "$k")/"); done
          [ ${#dirs[@]} -gt 1 ] || { echo "no overlays found"; exit 1; }
          for dir in "${dirs[@]}"; do
            echo "::group::${dir}"
            kubectl kustomize "${dir}" | kc -
            echo "::endgroup::"
          done
          # Per-cluster roots and Applications are plain files, not kustomizations.
          for dir in argocd/clusters/*/; do
            echo "::group::${dir}"
            kc "${dir}"
            echo "::endgroup::"
          done
          # Helm sources in Applications: render the pinned chart with the same
          # value files ArgoCD uses ($values/ points at this repo), so a bad
          # values file fails here rather than at sync time. The output is kept
          # in rendered/<cluster>-<app>.yaml for the checks in later steps.
          mkdir -p rendered
          for app in argocd/clusters/*/apps/*.yaml; do
            cluster=$(basename "$(dirname "$(dirname "$app")")")
            n=$(yq '[.spec.sources[]? | select(.chart)] | length' "$app")
            for ((i = 0; i < n; i++)); do
              q() { yq "[.spec.sources[] | select(.chart)][$i] | $1" "$app"; }
              values=()
              while IFS= read -r f; do
                [ -n "$f" ] && values+=(-f "${f#\$values/}")
              done < <(q '.helm.valueFiles[]?')
              echo "::group::${app}: $(q .chart) $(q .targetRevision)"
              ./helm template "$(q .helm.releaseName)" "$(q .chart)" \
                --repo "$(q .repoURL)" --version "$(q .targetRevision)" \
                --namespace "$(yq .spec.destination.namespace "$app")" "${values[@]}" \
                | tee "rendered/${cluster}-$(basename "$app" .yaml).yaml" | kc -
              echo "::endgroup::"
            done
          done

      # ADR 0020 edge settings, checked on the rendered Traefik output so a
      # misconfiguration fails at PR time, not on the live URL.
      - name: Assert Traefik edge settings (ADR 0020)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(rendered/*-traefik.yaml)
          [ ${#files[@]} -gt 0 ] || { echo "no rendered traefik app found"; exit 1; }
          fail() { echo "FAIL: $*"; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::${f}"
            svc='select(.kind == "Service" and .metadata.name == "traefik")'
            [ "$(yq "${svc} | .spec.type" "$f")" = "LoadBalancer" ] || fail "Service is not a LoadBalancer"
            [ "$(yq "${svc} | .metadata.annotations[\"oci.oraclecloud.com/load-balancer-type\"]" "$f")" = "nlb" ] || fail "load-balancer-type is not nlb"
            [ "$(yq "${svc} | .spec.externalTrafficPolicy" "$f")" = "Cluster" ] || fail "externalTrafficPolicy is not Cluster"
            [ "$(yq "${svc} | .metadata.annotations[\"oci-network-load-balancer.oraclecloud.com/security-list-management-mode\"]" "$f")" = "None" ] || fail "security-list-management-mode is not None"
            # With externalTrafficPolicy Cluster this annotation makes requests fail.
            if grep -q 'is-preserve-source' "$f"; then fail "is-preserve-source must be absent"; fi
            args=$(yq 'select(.kind == "Deployment" and .metadata.name == "traefik") | .spec.template.spec.containers[0].args[]' "$f")
            grep -qx -- '--entryPoints.web.http.redirections.entryPoint.to=:443' <<<"$args" || fail "HTTP is not redirected to 443"
            grep -qx -- '--entryPoints.web.http.redirections.entryPoint.permanent=true' <<<"$args" || fail "redirect is not permanent"
            grep -qx -- '--providers.kubernetesingress' <<<"$args" || fail "Ingress provider is off"
            grep -qx -- '--api.dashboard=false' <<<"$args" || fail "dashboard is enabled"
            [ "$(yq 'select(.kind == "Deployment" and .metadata.name == "traefik") | .spec.replicas' "$f")" = "2" ] || fail "not 2 replicas"
            [ "$(yq 'select(.kind == "PodDisruptionBudget") | .metadata.name' "$f")" = "traefik" ] || fail "no PodDisruptionBudget"
            # Edge metrics (demo #92): scraped through a ClusterIP Service and a
            # ServiceMonitor, never published on the NLB Service.
            grep -qx -- '--metrics.prometheus=true' <<<"$args" || fail "Prometheus metrics are off"
            [ "$(yq 'select(.kind == "Service" and .metadata.name == "traefik-metrics") | .spec.type' "$f")" = "ClusterIP" ] || fail "traefik-metrics Service is missing or not ClusterIP"
            [ "$(yq 'select(.kind == "ServiceMonitor" and .metadata.name == "traefik") | .spec.selector.matchLabels["app.kubernetes.io/component"]' "$f")" = "metrics" ] || fail "no ServiceMonitor selecting the metrics Service"
            if yq "${svc} | .spec.ports[].port" "$f" | grep -qx 9100; then fail "metrics port 9100 is on the public Service"; fi
            echo "ok"
            echo "::endgroup::"
          done
          # Chart version must be an exact X.Y.Z, never a range or "latest".
          for app in argocd/clusters/*/apps/traefik.yaml; do
            v=$(yq '.spec.sources[] | select(.chart == "traefik") | .targetRevision' "$app")
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "${app}: chart version '${v}' is not pinned"
          done
          # The edge panel (demo #92) must query the Traefik series, or it
          # would silently show "No data".
          dash=apps/link-shortener/base/dashboards/slo-redirect.json
          yq '.panels[].targets[]?.expr' "$dash" | grep -q 'traefik_entrypoint_requests_total' || fail "${dash}: no panel queries traefik_entrypoint_requests_total"

      - name: Test alerting rules (promtool)
        run: |
          set -euo pipefail
          curl -fsSL -o prom.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prom.tgz" | sha256sum -c -
          tar -xzf prom.tgz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          # A PrometheusRule's .spec is a plain Prometheus rules file. Extract it
          # so promtool can lint it and run the unit tests next to it.
          yq '.spec' apps/link-shortener/base/slo-rules.yaml > tests/prometheus/slo-redirect.rules.yaml
          ./promtool check rules tests/prometheus/slo-redirect.rules.yaml
          ./promtool test rules tests/prometheus/*.test.yaml

      # A broken Alertmanager config is silent (the operator rejects it and no
      # alert is sent), so check the rendered config and its routing here.
      - name: Check Alertmanager config (amtool)
        run: |
          set -euo pipefail
          shopt -s nullglob
          curl -fsSL -o am.tgz "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          echo "${ALERTMANAGER_SHA256}  am.tgz" | sha256sum -c -
          tar -xzf am.tgz --strip-components=1 "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
          expect() {
            local want=$1; shift
            local got; got=$(./amtool config routes test --config.file=am.yaml "$@")
            [ "$got" = "$want" ] || { echo "route for $*: got '$got', want '$want'"; exit 1; }
          }
          files=(rendered/*-monitoring.yaml)
          [ ${#files[@]} -gt 0 ] || { echo "no rendered monitoring app found"; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::${f}"
            yq 'select(.kind == "Secret" and .metadata.name == "alertmanager-kps-alertmanager") | .data["alertmanager.yaml"]' "$f" \
              | base64 -d > am.yaml
            ./amtool check-config am.yaml
            # Routing contract: noise stays out of the channel, real alerts reach it.
            expect null alertname=Watchdog
            expect null alertname=InfoInhibitor
            expect null alertname=CPUThrottlingHigh severity=info
            expect discord alertname=RedirectErrorBudgetBurnFast severity=critical
            expect discord alertname=KubePodNotReady severity=warning
            echo "::endgroup::"
          done

      # ADR 0020: both Let's Encrypt issuers exist with the right ACME server, use
      # DNS-01 on Cloudflare with the cloudflare-api-token Secret, and the chart
      # is pinned.
      - name: Assert cert-manager issuers (ADR 0020)
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $*"; exit 1; }
          out=$(kubectl kustomize platform/cert-manager-issuers)
          for pair in "letsencrypt-staging https://acme-staging-v02.api.letsencrypt.org/directory" \
                      "letsencrypt-production https://acme-v02.api.letsencrypt.org/directory"; do
            read -r name server <<<"$pair"
            sel="select(.kind == \"ClusterIssuer\" and .metadata.name == \"${name}\")"
            [ "$(yq "${sel} | .spec.acme.server" <<<"$out")" = "$server" ] || fail "${name}: wrong ACME server"
            [ "$(yq "${sel} | .spec.acme.solvers[0].dns01.cloudflare.apiTokenSecretRef.name" <<<"$out")" = "cloudflare-api-token" ] || fail "${name}: not DNS-01 on Cloudflare with cloudflare-api-token"
          done
          # Chart version must be an exact vX.Y.Z, never a range or "latest".
          for app in argocd/clusters/*/apps/cert-manager.yaml; do
            v=$(yq '.spec.sources[] | select(.chart == "cert-manager") | .targetRevision' "$app")
            [[ "$v" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "${app}: chart version '${v}' is not pinned"
          done

      # ADR 0020: in every deployed link-shortener overlay, the backend reads its
      # link-creation tokens from the link-tokens Secret, mounted whole (a
      # subPath mount never sees a rotation or revocation) at the directory the
      # app is told to read. The overlay must ship that Secret as a strict-scoped
      # SealedSecret: the volume is not optional, so without it new pods never
      # start (old ones keep serving, but the rollout stalls).
      - name: Assert link-token wiring (ADR 0020)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "FAIL: $*"; exit 1; }
          apps=(argocd/clusters/*/apps/link-shortener.yaml)
          [ ${#apps[@]} -gt 0 ] || fail "no link-shortener Application found"
          for app in "${apps[@]}"; do
            path=$(yq '.spec.source.path' "$app")
            echo "::group::${path}"
            out=$(kubectl kustomize "$path")
            pod_spec='select(.kind == "Deployment" and .metadata.name == "backend") | .spec.template.spec'
            # One name per line; documents that do not match print nothing.
            vol=$(yq "${pod_spec} | .volumes[]? | select(.secret.secretName == \"link-tokens\") | .name" <<<"$out")
            [ -n "$vol" ] || fail "${path}: backend has no volume from Secret link-tokens"
            [ "$(wc -l <<<"$vol")" -eq 1 ] || fail "${path}: more than one link-tokens volume"
            [ "$(yq "${pod_spec} | .volumes[] | select(.name == \"${vol}\") | .secret.optional // false" <<<"$out")" = "false" ] || fail "${path}: link-tokens volume must not be optional"
            container="${pod_spec} | .containers[] | select(.name == \"backend\")"
            token_mount="${container} | .volumeMounts[]? | select(.name == \"${vol}\")"
            mount=$(yq "${token_mount} | .mountPath" <<<"$out")
            [ -n "$mount" ] || fail "${path}: link-tokens volume is not mounted in the backend container"
            [ -z "$(yq "${token_mount} | .subPath // \"\"" <<<"$out")" ] || fail "${path}: subPath mount never sees token updates"
            [ "$(yq "${container} | .env[]? | select(.name == \"LINK_TOKENS_DIR\") | .value" <<<"$out")" = "$mount" ] || fail "${path}: LINK_TOKENS_DIR is not the mount path"
            [ "$(yq "${container} | .env[]? | select(.name == \"LINK_CREATE_MODE\") | .value" <<<"$out")" = "token" ] || fail "${path}: LINK_CREATE_MODE is not token"
            sealed=$(yq 'select(.kind == "SealedSecret" and .metadata.name == "link-tokens")' <<<"$out")
            [ -n "$sealed" ] || fail "${path}: no link-tokens SealedSecret"
            # Strict scope binds the ciphertext to this namespace; any other one
            # (say, from a kustomize namespace change) makes it undecryptable.
            [ "$(yq '.metadata.namespace' <<<"$sealed")" = "link-shortener" ] || fail "${path}: link-tokens is not in namespace link-shortener"
            [ "$(yq '.spec.encryptedData | length' <<<"$sealed")" -gt 0 ] || fail "${path}: link-tokens holds no tokens"
            # Strict scope: no annotation may widen it to the namespace or cluster.
            if grep -qE 'sealedsecrets\.bitnami\.com/(cluster|namespace)-wide: "?true' <<<"$sealed"; then
              fail "${path}: link-tokens must be sealed with --scope strict"
            fi
            echo "ok"
            echo "::endgroup::"
          done

      # ADR 0020: external-dns manages only sandeeprn.in records it owns, only
      # from Ingresses, DNS only (never proxied). The owner id and TXT prefix
      # are pinned per cluster: changing either after deployment orphans the
      # live records, because the new identity does not own them, so `sync`
      # neither updates nor deletes them.
      - name: Assert external-dns settings (ADR 0020)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "FAIL: $*"; exit 1; }
          files=(rendered/*-external-dns.yaml)
          [ ${#files[@]} -gt 0 ] || fail "no rendered external-dns app found"
          for f in "${files[@]}"; do
            echo "::group::${f}"
            cluster=$(basename "$f" -external-dns.yaml)
            # Never change these for a running cluster (see above).
            case "$cluster" in
              oke) owner=oci-demo-oke ;;
              *) fail "${f}: no pinned TXT owner id for cluster ${cluster}" ;;
            esac
            container='select(.kind == "Deployment" and .metadata.name == "external-dns") | .spec.template.spec.containers[] | select(.name == "external-dns")'
            args=$(yq "${container} | .args[]" "$f")
            # Fixed strings: the dot in sandeeprn.in must not match any character.
            has() { grep -qFx -- "$1" <<<"$args" || fail "${f}: missing $1"; }
            only() { [ "$(grep -c -- "^$1=" <<<"$args")" -eq 1 ] || fail "${f}: more than one $1"; }
            has --provider=cloudflare
            has --source=ingress
            only --source
            has --domain-filter=sandeeprn.in
            only --domain-filter
            has --policy=sync
            has --registry=txt
            has "--txt-owner-id=${owner}"
            has --txt-prefix=edns-
            # The NLB's private IP is in the Ingress status too; it must never
            # reach public DNS.
            has --exclude-target-net=10.0.0.0/8
            has --exclude-target-net=172.16.0.0/12
            has --exclude-target-net=192.168.0.0/16
            # DNS only: the global flag must be off (Ingresses are checked below).
            if grep -q -- '^--cloudflare-proxied' <<<"$args"; then fail "${f}: records must be DNS only"; fi
            [ "$(yq "${container} | .env[]? | select(.name == \"CF_API_TOKEN\") | .valueFrom.secretKeyRef.name" "$f")" = "cloudflare-api-token" ] || fail "${f}: CF_API_TOKEN is not from Secret cloudflare-api-token"
            echo "ok"
            echo "::endgroup::"
          done
          # Chart version must be an exact X.Y.Z, never a range or "latest".
          for app in argocd/clusters/*/apps/external-dns.yaml; do
            v=$(yq '.spec.sources[] | select(.chart == "external-dns") | .targetRevision' "$app")
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "${app}: chart version '${v}' is not pinned"
          done

      # ADR 0020: every Ingress of a deployed link-shortener overlay is served by
      # Traefik over TLS from a Let's Encrypt issuer, is not proxied by
      # Cloudflare, sends everything to the backend Service, and goes through
      # the rate-limit Middleware shipped in the same overlay.
      - name: Assert app Ingress and rate limit (ADR 0020)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "FAIL: $*"; exit 1; }
          apps=(argocd/clusters/*/apps/link-shortener.yaml)
          [ ${#apps[@]} -gt 0 ] || fail "no link-shortener Application found"
          for app in "${apps[@]}"; do
            path=$(yq '.spec.source.path' "$app")
            echo "::group::${path}"
            out=$(kubectl kustomize "$path")
            names=$(yq 'select(.kind == "Ingress") | .metadata.name' <<<"$out")
            [ -n "$names" ] || fail "${path}: no Ingress"
            mw=$(yq 'select(.kind == "Middleware" and .metadata.name == "rate-limit")' <<<"$out")
            [ -n "$mw" ] || fail "${path}: no rate-limit Middleware"
            [ "$(yq '.spec.rateLimit.average // 0' <<<"$mw")" -gt 0 ] || fail "${path}: rate-limit has no average"
            [ "$(yq '.spec.rateLimit.burst // 0' <<<"$mw")" -gt 0 ] || fail "${path}: rate-limit has no burst"
            # Traefik's name for a CRD Middleware: <namespace>-<name>@kubernetescrd.
            ref="$(yq '.metadata.namespace' <<<"$mw")-rate-limit@kubernetescrd"
            # HSTS: browsers keep it for max-age and it cannot be withdrawn
            # early, so it covers this host only (ADR 0020, demo #90). The
            # max-age must match scripts/verify-public-url.sh in the demo repo.
            hsts=$(yq 'select(.kind == "Middleware" and .metadata.name == "hsts")' <<<"$out")
            [ -n "$hsts" ] || fail "${path}: no hsts Middleware"
            [ "$(yq '.spec.headers.stsSeconds' <<<"$hsts")" = "15552000" ] || fail "${path}: hsts max-age is not 15552000 (180 days)"
            [ "$(yq '.spec.headers.stsIncludeSubdomains // false' <<<"$hsts")" = "false" ] || fail "${path}: hsts must not include subdomains"
            [ "$(yq '.spec.headers.stsPreload // false' <<<"$hsts")" = "false" ] || fail "${path}: hsts must not ask for preload"
            hsts_ref="$(yq '.metadata.namespace' <<<"$hsts")-hsts@kubernetescrd"
            for name in $names; do
              ing="select(.kind == \"Ingress\" and .metadata.name == \"${name}\")"
              a() { yq "${ing} | .metadata.annotations[\"$1\"] // \"\"" <<<"$out"; }
              [ "$(yq "${ing} | .spec.ingressClassName" <<<"$out")" = "traefik" ] || fail "${name}: ingressClassName is not traefik"
              tr ',' '\n' <<<"$(a traefik.ingress.kubernetes.io/router.middlewares)" | tr -d ' ' | grep -qFx -- "$ref" || fail "${name}: rate-limit Middleware (${ref}) is not attached"
              tr ',' '\n' <<<"$(a traefik.ingress.kubernetes.io/router.middlewares)" | tr -d ' ' | grep -qFx -- "$hsts_ref" || fail "${name}: hsts Middleware (${hsts_ref}) is not attached"
              # Production only: a staging certificate is not browser-trusted,
              # and HSTS on an untrusted certificate locks visitors out (demo #90).
              [ "$(a cert-manager.io/cluster-issuer)" = "letsencrypt-production" ] || fail "${name}: not issued by letsencrypt-production"
              [ "$(a external-dns.alpha.kubernetes.io/cloudflare-proxied)" = "false" ] || fail "${name}: must be DNS only (cloudflare-proxied \"false\")"
              # The loops below would pass on zero rules, and a defaultBackend
              # would route around them: require rules, forbid defaultBackend.
              [ "$(yq "${ing} | .spec.rules | length" <<<"$out")" -gt 0 ] || fail "${name}: no rules"
              [ "$(yq "${ing} | .spec | has(\"defaultBackend\")" <<<"$out")" = "false" ] || fail "${name}: defaultBackend bypasses the host rules"
              # Every rule host is covered by a TLS entry with a Secret.
              for host in $(yq "${ing} | .spec.rules[].host" <<<"$out"); do
                [ -n "$(yq "${ing} | .spec.tls[]? | select(.hosts[]? == \"${host}\") | .secretName" <<<"$out")" ] || fail "${name}: ${host} has no TLS Secret"
              done
              [ -z "$(yq "${ing} | .spec.rules[].http.paths[] | select(.backend.service.name != \"backend\") | .path" <<<"$out")" ] || fail "${name}: a path does not go to the backend Service"
            done
            echo "ok"
            echo "::endgroup::"
          done

      - name: Reject plain Secrets
        run: |
          set -euo pipefail
          # Only SealedSecrets may be committed (ADR 0006).
          if grep -rEl --include='*.yaml' --include='*.yml' '^kind: Secret$' apps argocd monitoring platform edge 2>/dev/null; then
            echo "plain Secret manifest found; use a SealedSecret"; exit 1
          fi
