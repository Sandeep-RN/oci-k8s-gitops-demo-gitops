name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
      # sha256 of kubeconform-linux-amd64.tar.gz from the release's CHECKSUMS file
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # The version the node runs (demo repo, terraform/k3s `k3s_version`,
      # without the +k3s suffix). Change both together after a k3s upgrade.
      K8S_VERSION: 1.36.5
      HELM_VERSION: v4.3.0
      # sha256 of helm-<version>-linux-amd64.tar.gz from get.helm.sh
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      PROMETHEUS_VERSION: 3.15.0
      # sha256 of prometheus-<version>.linux-amd64.tar.gz from the release's sha256sums.txt
      PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
      # Same version as the chart's Alertmanager image
      ALERTMANAGER_VERSION: 0.34.1
      # sha256 of alertmanager-<version>.linux-amd64.tar.gz from the release's sha256sums.txt
      ALERTMANAGER_SHA256: 265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeconform (checksum verified)
        run: |
          curl -fsSL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar -xzf kc.tgz kubeconform

      - name: Install Helm (checksum verified)
        run: |
          curl -fsSL -o helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm

      # Render every overlay and the ArgoCD install exactly as ArgoCD would, then
      # check the result against the Kubernetes schemas plus the community CRD
      # catalog (for Application/AppProject). A broken manifest fails here, not
      # in the cluster.
      - name: Render and validate
        env:
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          # CustomResourceDefinition has no published schema; the only CRDs here
          # are ArgoCD's own, taken unmodified from the pinned upstream install.
          kc_args=(-strict -summary -kubernetes-version "${K8S_VERSION}"
                   -schema-location default -schema-location "${CRD_SCHEMAS}"
                   -skip CustomResourceDefinition)
          kc() { ./kubeconform "${kc_args[@]}" "$@"; }
          dirs=(apps/*/overlays/*/ argocd/install/ platform/*/)
          # monitoring/ and edge/ also hold Helm values folders, which are not
          # kustomizations.
          for k in monitoring/*/kustomization.yaml edge/*/kustomization.yaml; do dirs+=("$(dirname "$k")/"); done
          [ ${#dirs[@]} -gt 1 ] || { echo "no overlays found"; exit 1; }
          for dir in "${dirs[@]}"; do
            echo "::group::${dir}"
            kubectl kustomize "${dir}" | kc -
            echo "::endgroup::"
          done
          # Per-cluster roots and Applications are plain files, not kustomizations.
          for dir in argocd/clusters/*/; do
            echo "::group::${dir}"
            kc "${dir}"
            echo "::endgroup::"
          done
          # Helm sources in Applications: render the pinned chart with the same
          # value files ArgoCD uses ($values/ points at this repo), so a bad
          # values file fails here rather than at sync time. The output is kept
          # in rendered/<cluster>-<app>.yaml for the checks in later steps.
          mkdir -p rendered
          for app in argocd/clusters/*/apps/*.yaml; do
            cluster=$(basename "$(dirname "$(dirname "$app")")")
            n=$(yq '[.spec.sources[]? | select(.chart)] | length' "$app")
            for ((i = 0; i < n; i++)); do
              q() { yq "[.spec.sources[] | select(.chart)][$i] | $1" "$app"; }
              values=()
              while IFS= read -r f; do
                [ -n "$f" ] && values+=(-f "${f#\$values/}")
              done < <(q '.helm.valueFiles[]?')
              echo "::group::${app}: $(q .chart) $(q .targetRevision)"
              ./helm template "$(q .helm.releaseName)" "$(q .chart)" \
                --repo "$(q .repoURL)" --version "$(q .targetRevision)" \
                --namespace "$(yq .spec.destination.namespace "$app")" "${values[@]}" \
                | tee "rendered/${cluster}-$(basename "$app" .yaml).yaml" | kc -
              echo "::endgroup::"
            done
          done

      # The edge panel (demo #92) must query the Traefik series, or it would
      # silently show "No data". (The OKE-era checks on the upstream Traefik chart
      # went with the OKE target, demo #182; k3s Traefik is asserted below.)
      - name: Assert dashboard edge panel queries Traefik
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $*"; exit 1; }
          dash=apps/link-shortener/base/dashboards/slo-redirect.json
          yq '.panels[].targets[]?.expr' "$dash" | grep -q 'traefik_entrypoint_requests_total' || fail "${dash}: no panel queries traefik_entrypoint_requests_total"

      # ADR 0022: on k3s, Traefik is the chart k3s ships, configured by the
      # HelmChartConfig in edge/traefik-k3s. Its values are a string, so no
      # schema checks them, and ArgoCD reports Synced even when k3s's Helm job
      # rejects them. Render the bundled chart with k3s's default values plus
      # ours, in k3s's merge order, and assert the edge settings on the result.
      - name: Assert k3s Traefik settings (ADR 0022)
        env:
          # The chart bundled with the k3s version the node runs (demo repo,
          # terraform/k3s `k3s_version`), taken from k3s-io/k3s-charts at a
          # fixed commit. After a k3s upgrade, update these three values and
          # edge/traefik-k3s/k3s-default-values.yaml together.
          K3S_CHARTS_COMMIT: 2592cc05154ada6333f877d0cc279c25d0c1488b
          K3S_TRAEFIK_CHART: traefik-40.1.5+up40.1.0
          # sha256 of assets/traefik/<chart>.tgz at that commit
          K3S_TRAEFIK_CHART_SHA256: d4d0e818284d310372d38adfce9a1cfb3179a69fc9f3ca8bfadb33581000b778
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $*"; exit 1; }
          dir=edge/traefik-k3s
          curl -fsSL -o k3s-traefik.tgz "https://raw.githubusercontent.com/k3s-io/k3s-charts/${K3S_CHARTS_COMMIT}/assets/traefik/${K3S_TRAEFIK_CHART/+/%2B}.tgz"
          echo "${K3S_TRAEFIK_CHART_SHA256}  k3s-traefik.tgz" | sha256sum -c -

          objs=$(kubectl kustomize "$dir")
          # k3s reads only the HelmChartConfig kube-system/traefik. Any other
          # name or namespace is ignored without an error.
          hcc='select(.kind == "HelmChartConfig")'
          [ "$(yq "${hcc} | .metadata.namespace + \"/\" + .metadata.name" <<<"$objs")" = "kube-system/traefik" ] || fail "${dir}: the HelmChartConfig must be kube-system/traefik"
          yq "${hcc} | .spec.valuesContent" <<<"$objs" > k3s-traefik-values.yaml
          [ -s k3s-traefik-values.yaml ] || fail "${dir}: empty valuesContent"

          # Rendered next to the Argo apps' output, but this is k3s's bundled chart, not an Application.
          mkdir -p rendered
          f=rendered/k3s-traefik-config.yaml
          ./helm template traefik k3s-traefik.tgz --namespace kube-system \
            -f "${dir}/k3s-default-values.yaml" -f k3s-traefik-values.yaml \
            | tee "$f" | ./kubeconform -strict -summary -kubernetes-version "${K8S_VERSION}" -

          svc='select(.kind == "Service" and .metadata.name == "traefik")'
          dep='select(.kind == "Deployment" and .metadata.name == "traefik")'
          ctr="${dep} | .spec.template.spec.containers[0]"
          args=$(yq "${ctr} | .args[]" "$f")

          # Edge: ServiceLB publishes a LoadBalancer Service on the node. Local
          # keeps client IPs for the per-IP rate limit.
          [ "$(yq "${svc} | .spec.type" "$f")" = "LoadBalancer" ] || fail "Service is not a LoadBalancer"
          [ "$(yq "${svc} | .spec.externalTrafficPolicy" "$f")" = "Local" ] || fail "externalTrafficPolicy is not Local"

          # Public address: Traefik writes the sealed public IP into the Ingress
          # status. publishedService would publish the node's private IP.
          grep -qFx -- '--providers.kubernetesingress.ingressendpoint.ip=$(PUBLIC_IP)' <<<"$args" || fail "ingressendpoint.ip is not \$(PUBLIC_IP)"
          if grep -q -- 'ingressendpoint.publishedservice' <<<"$args"; then fail "publishedService must be off"; fi
          ref=$(yq "${ctr} | .env[] | select(.name == \"PUBLIC_IP\") | .valueFrom.secretKeyRef | .name + \"/\" + .key + \"/\" + ((.optional // false) | tostring)" "$f")
          [ "$ref" = "traefik-public-ip/public-ip/false" ] || fail "PUBLIC_IP must come from Secret traefik-public-ip, key public-ip, not optional (got '${ref}')"
          # With a missing Secret the new pod cannot start; the old one must
          # keep serving meanwhile.
          [ "$(yq "${dep} | .spec.strategy.rollingUpdate.maxUnavailable" "$f")" = "0" ] || fail "rolling update maxUnavailable is not 0"
          # The Secret itself: shipped next to the config, strict scope.
          sealed=$(yq 'select(.kind == "SealedSecret" and .metadata.name == "traefik-public-ip")' <<<"$objs")
          [ -n "$sealed" ] || fail "${dir}: no traefik-public-ip SealedSecret"
          [ "$(yq '.metadata.namespace' <<<"$sealed")" = "kube-system" ] || fail "${dir}: traefik-public-ip is not in kube-system"
          [ "$(yq '.spec.encryptedData | keys | join(",")' <<<"$sealed")" = "public-ip" ] || fail "${dir}: traefik-public-ip must hold exactly the key public-ip"
          if grep -qE 'sealedsecrets\.bitnami\.com/(cluster|namespace)-wide: "?true' <<<"$sealed"; then
            fail "${dir}: traefik-public-ip must be sealed with --scope strict"
          fi

          # Port 80 only redirects to HTTPS; no dashboard.
          grep -qx -- '--entryPoints.web.http.redirections.entryPoint.to=:443' <<<"$args" || fail "HTTP is not redirected to 443"
          grep -qx -- '--entryPoints.web.http.redirections.entryPoint.permanent=true' <<<"$args" || fail "redirect is not permanent"
          grep -qx -- '--providers.kubernetesingress' <<<"$args" || fail "Ingress provider is off"
          grep -qx -- '--providers.kubernetescrd' <<<"$args" || fail "CRD provider is off (Middlewares need it)"
          grep -qx -- '--api.dashboard=false' <<<"$args" || fail "dashboard is enabled"

          # Edge metrics: a ClusterIP Service, never on the public one. The
          # ServiceMonitor is ours, not the chart's, so the Helm release does
          # not need the monitoring CRDs.
          grep -qx -- '--metrics.prometheus=true' <<<"$args" || fail "Prometheus metrics are off"
          msvc='select(.kind == "Service" and .metadata.name == "traefik-metrics")'
          [ "$(yq "${msvc} | .spec.type" "$f")" = "ClusterIP" ] || fail "traefik-metrics Service is missing or not ClusterIP"
          if yq "${svc} | .spec.ports[].port" "$f" | grep -qx 9100; then fail "metrics port 9100 is on the public Service"; fi
          [ -z "$(yq 'select(.kind == "ServiceMonitor") | .metadata.name' "$f")" ] || fail "the chart must not render a ServiceMonitor"
          sm='select(.kind == "ServiceMonitor" and .metadata.name == "traefik")'
          [ "$(yq "${sm} | .metadata.namespace" <<<"$objs")" = "kube-system" ] || fail "${dir}: no ServiceMonitor traefik in kube-system"
          # Every selector label must be on the rendered metrics Service, or
          # Prometheus finds no target and the panel silently shows nothing.
          labels=$(yq "${sm} | .spec.selector.matchLabels | to_entries | .[] | .key + \"=\" + .value" <<<"$objs")
          [ -n "$labels" ] || fail "${dir}: ServiceMonitor has no selector labels"
          while IFS='=' read -r key want; do
            [ "$(yq "${msvc} | .metadata.labels[\"${key}\"]" "$f")" = "$want" ] || fail "${dir}: ServiceMonitor label ${key}=${want} is not on the traefik-metrics Service"
          done <<<"$labels"
          port=$(yq "${sm} | .spec.endpoints[0].targetPort" <<<"$objs")
          [ -n "$(yq "${ctr} | .ports[] | select(.name == \"${port}\") | .containerPort" "$f")" ] || fail "${dir}: ServiceMonitor targetPort '${port}' is not a named port of the Traefik container"
          echo "ok"

      - name: Test alerting rules (promtool)
        run: |
          set -euo pipefail
          curl -fsSL -o prom.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prom.tgz" | sha256sum -c -
          tar -xzf prom.tgz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          # A PrometheusRule's .spec is a plain Prometheus rules file. Extract it
          # so promtool can lint it and run the unit tests next to it.
          yq '.spec' apps/link-shortener/base/slo-rules.yaml > tests/prometheus/slo-redirect.rules.yaml
          yq '.spec' monitoring/k3s/platform-rules.yaml > tests/prometheus/platform.rules.yaml
          ./promtool check rules tests/prometheus/slo-redirect.rules.yaml tests/prometheus/platform.rules.yaml
          ./promtool test rules tests/prometheus/*.test.yaml

      # Demo #140: the platform alerts exist with the severities the routing
      # contract expects, each with a `for:` and a runbook link, and the
      # cert-manager ServiceMonitor still selects the controller Service that
      # the pinned chart renders. promtool above proves what each rule does;
      # this proves a rule cannot be deleted or renamed, or its scrape quietly
      # broken, while CI stays green (an empty alert result is not an alert).
      - name: Assert platform alerts and the cert-manager scrape (demo #140)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "FAIL: $*"; exit 1; }
          out=$(kubectl kustomize monitoring/k3s)
          rule='select(.kind == "PrometheusRule" and .metadata.name == "platform-alerts")'
          [ -n "$(yq "${rule} | .metadata.name" <<<"$out")" ] || fail "monitoring/k3s: PrometheusRule platform-alerts is not rendered"
          for pair in "CertificateExpiringSoon critical" "CertificateExpiringSoon warning" \
                      "CertificateNotReady warning" "CertManagerMetricsMissing warning" \
                      "TraefikServerErrorsHigh warning" "TraefikMetricsMissing warning" \
                      "NodeRootDiskLow critical" "NodeRootDiskLow warning"; do
            read -r name sev <<<"$pair"
            # One line per matching rule (yq prints once per match, nothing for no match).
            sel=".spec.groups[].rules[] | select(.alert == \"${name}\" and .labels.severity == \"${sev}\")"
            n=$(yq "${rule} | ${sel} | .alert" <<<"$out" | wc -l | tr -d ' ')
            [ "$n" = "1" ] || fail "alert ${name} (${sev}): expected exactly one rule, found ${n}"
            [ -n "$(yq "${rule} | ${sel} | .for // \"\"" <<<"$out")" ] || fail "alert ${name} (${sev}): no for: duration"
            yq "${rule} | ${sel} | .annotations.runbook_url // \"\"" <<<"$out" \
              | grep -q '^https://github.com/Sandeep-RN/oci-k8s-gitops-demo/blob/main/docs/runbooks/' \
              || fail "alert ${name} (${sev}): runbook_url missing or not a demo runbook link"
          done
          # The scrape: a ServiceMonitor for the cert-manager controller that keeps the
          # Certificate's own namespace label, matching the rendered chart's Service.
          sm='select(.kind == "ServiceMonitor" and .metadata.name == "cert-manager")'
          [ -n "$(yq "${sm} | .metadata.name" <<<"$out")" ] || fail "monitoring/k3s: ServiceMonitor cert-manager is not rendered"
          [ "$(yq "${sm} | .spec.endpoints[0].honorLabels" <<<"$out")" = "true" ] || fail "cert-manager ServiceMonitor: honorLabels is not true (alerts would be grouped under the cert-manager namespace)"
          [ "$(yq "${sm} | .spec.namespaceSelector.matchNames[0]" <<<"$out")" = "cert-manager" ] || fail "cert-manager ServiceMonitor: namespaceSelector is not cert-manager"
          port=$(yq "${sm} | .spec.endpoints[0].port" <<<"$out")
          files=(rendered/*-cert-manager.yaml)
          [ ${#files[@]} -gt 0 ] || fail "no rendered cert-manager chart found"
          svc='select(.kind == "Service" and .metadata.name == "cert-manager")'
          for f in "${files[@]}"; do
            while read -r k v; do
              [ "$(yq "${svc} | .metadata.labels[\"${k}\"]" "$f")" = "$v" ] || fail "${f}: Service cert-manager has no label ${k}=${v}, which the ServiceMonitor selects"
            done < <(yq "${sm} | .spec.selector.matchLabels | to_entries | .[] | .key + \" \" + .value" <<<"$out")
            [ -n "$(yq "${svc} | .spec.ports[] | select(.name == \"${port}\") | .port" "$f")" ] || fail "${f}: Service cert-manager has no port named '${port}'"
          done
          echo "ok"

      # Demo #230: the demo site's status strip reads argocd_app_info. If an Argo CD
      # upgrade renamed the metrics Service's labels or port, the ServiceMonitor
      # would select nothing and the tile would go blank with CI still green.
      - name: Assert the Argo CD scrape (demo #230)
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $*"; exit 1; }
          out=$(kubectl kustomize monitoring/k3s)
          sm='select(.kind == "ServiceMonitor" and .metadata.name == "argocd-metrics")'
          [ -n "$(yq "${sm} | .metadata.name" <<<"$out")" ] || fail "monitoring/k3s: ServiceMonitor argocd-metrics is not rendered"
          [ "$(yq "${sm} | .spec.namespaceSelector.matchNames[0]" <<<"$out")" = "argocd" ] || fail "argocd-metrics ServiceMonitor: namespaceSelector is not argocd"
          [ "$(yq "${sm} | .spec.endpoints[0].metricRelabelings[0].regex" <<<"$out")" = "argocd_app_info" ] || fail "argocd-metrics ServiceMonitor: it must keep only argocd_app_info"
          port=$(yq "${sm} | .spec.endpoints[0].port" <<<"$out")
          argo=$(kubectl kustomize argocd/install)
          svc='select(.kind == "Service" and .metadata.name == "argocd-metrics")'
          while read -r k v; do
            [ "$(yq "${svc} | .metadata.labels[\"${k}\"]" <<<"$argo")" = "$v" ] || fail "Service argocd-metrics has no label ${k}=${v}, which the ServiceMonitor selects"
          done < <(yq "${sm} | .spec.selector.matchLabels | to_entries | .[] | .key + \" \" + .value" <<<"$out")
          [ -n "$(yq "${svc} | .spec.ports[] | select(.name == \"${port}\") | .port" <<<"$argo")" ] || fail "Service argocd-metrics has no port named '${port}'"
          echo "ok"

      # A broken Alertmanager config is silent (the operator rejects it and no
      # alert is sent), so check the rendered config and its routing here.
      - name: Check Alertmanager config (amtool)
        run: |
          set -euo pipefail
          shopt -s nullglob
          curl -fsSL -o am.tgz "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          echo "${ALERTMANAGER_SHA256}  am.tgz" | sha256sum -c -
          tar -xzf am.tgz --strip-components=1 "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool"
          expect() {
            local want=$1; shift
            local got; got=$(./amtool config routes test --config.file=am.yaml "$@")
            [ "$got" = "$want" ] || { echo "route for $*: got '$got', want '$want'"; exit 1; }
          }
          files=(rendered/*-monitoring.yaml)
          [ ${#files[@]} -gt 0 ] || { echo "no rendered monitoring app found"; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::${f}"
            yq 'select(.kind == "Secret" and .metadata.name == "alertmanager-kps-alertmanager") | .data["alertmanager.yaml"]' "$f" \
              | base64 -d > am.yaml
            ./amtool check-config am.yaml
            # Routing contract: noise stays out of the channel, real alerts reach it.
            expect null alertname=Watchdog
            expect null alertname=InfoInhibitor
            expect null alertname=CPUThrottlingHigh severity=info
            expect discord alertname=RedirectErrorBudgetBurnFast severity=critical
            expect discord alertname=KubePodNotReady severity=warning
            expect discord alertname=CertificateExpiringSoon severity=critical
            expect discord alertname=CertificateExpiringSoon severity=warning
            expect discord alertname=TraefikServerErrorsHigh severity=warning
            expect discord alertname=NodeRootDiskLow severity=critical
            echo "::endgroup::"
          done

      # ADR 0020: both Let's Encrypt issuers exist with the right ACME server, use
      # DNS-01 on Cloudflare with the cloudflare-api-token Secret, and the chart
      # is pinned.
      - name: Assert cert-manager issuers (ADR 0020)
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $*"; exit 1; }
          out=$(kubectl kustomize platform/cert-manager-issuers)
          for pair in "letsencrypt-staging https://acme-staging-v02.api.letsencrypt.org/directory" \
                      "letsencrypt-production https://acme-v02.api.letsencrypt.org/directory"; do
            read -r name server <<<"$pair"
            sel="select(.kind == \"ClusterIssuer\" and .metadata.name == \"${name}\")"
            [ "$(yq "${sel} | .spec.acme.server" <<<"$out")" = "$server" ] || fail "${name}: wrong ACME server"
            [ "$(yq "${sel} | .spec.acme.solvers[0].dns01.cloudflare.apiTokenSecretRef.name" <<<"$out")" = "cloudflare-api-token" ] || fail "${name}: not DNS-01 on Cloudflare with cloudflare-api-token"
          done
          # Chart version must be an exact vX.Y.Z, never a range or "latest".
          for app in argocd/clusters/*/apps/cert-manager.yaml; do
            v=$(yq '.spec.sources[] | select(.chart == "cert-manager") | .targetRevision' "$app")
            [[ "$v" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "${app}: chart version '${v}' is not pinned"
          done

      # ADR 0025: the on-call assistant runs inside a hard cap that the PLATFORM
      # owns. These checks pin the cap's values and the AppProject's limits, so a
      # later edit cannot quietly loosen either. Changing a value here means
      # changing ADR 0025 too. The tenant's own folder (#195) is checked in the
      # loop at the end: it may not ship the objects that set its own cap.
      - name: Assert oncall-assistant guardrails (ADR 0025)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "FAIL: $*"; exit 1; }
          dir=platform/oncall-assistant-guardrails
          ns=oncall-assistant
          out=$(kubectl kustomize "$dir")

          # The Namespace survives a prune of its Application (it holds the DB).
          nssel="select(.kind == \"Namespace\" and .metadata.name == \"${ns}\")"
          [ -n "$(yq "${nssel} | .metadata.name" <<<"$out")" ] || fail "${dir}: no Namespace ${ns}"
          [ "$(yq "${nssel} | .metadata.annotations[\"argocd.argoproj.io/sync-options\"]" <<<"$out")" = "Delete=false" ] || fail "${dir}: Namespace ${ns} must carry sync-options Delete=false"

          # The cap: exactly one quota, in the tenant's namespace, with the ADR's values.
          q='select(.kind == "ResourceQuota")'
          [ "$(yq "${q} | .metadata.name" <<<"$out" | wc -l)" -eq 1 ] || fail "${dir}: expected exactly one ResourceQuota"
          [ "$(yq "${q} | .metadata.namespace" <<<"$out")" = "$ns" ] || fail "${dir}: ResourceQuota is not in namespace ${ns}"
          for pair in limits.memory=1Gi limits.cpu=1 requests.memory=1Gi requests.cpu=1; do
            k="${pair%%=*}"; want="${pair#*=}"
            [ "$(yq "${q} | .spec.hard[\"${k}\"]" <<<"$out")" = "$want" ] || fail "${dir}: ResourceQuota ${k} is not ${want}"
          done

          # Defaults so no pod runs uncapped; a single container cannot take the whole cap.
          lr='select(.kind == "LimitRange") | .spec.limits[] | select(.type == "Container")'
          [ "$(yq "select(.kind == \"LimitRange\") | .metadata.namespace" <<<"$out")" = "$ns" ] || fail "${dir}: no LimitRange in namespace ${ns}"
          for pair in default.memory=256Mi default.cpu=500m defaultRequest.memory=256Mi defaultRequest.cpu=100m max.memory=384Mi max.cpu=1; do
            k="${pair%%=*}"; want="${pair#*=}"
            [ "$(yq "${lr} | .${k}" <<<"$out")" = "$want" ] || fail "${dir}: LimitRange ${k} is not ${want}"
          done

          # Below every other workload, never preempts, never the cluster default.
          pc='select(.kind == "PriorityClass" and .metadata.name == "oncall-assistant-low")'
          [ "$(yq "${pc} | .value" <<<"$out")" -lt 0 ] || fail "${dir}: PriorityClass value must be negative"
          [ "$(yq "${pc} | .preemptionPolicy" <<<"$out")" = "Never" ] || fail "${dir}: PriorityClass preemptionPolicy must be Never"
          [ "$(yq "${pc} | .globalDefault // false" <<<"$out")" = "false" ] || fail "${dir}: PriorityClass must not be the global default"

          # The tenant's AppProject: this repo only, its namespace only, nothing
          # cluster-scoped, and no say over its own quota or defaults.
          projects=(argocd/clusters/*/apps/project-oncall.yaml)
          [ ${#projects[@]} -gt 0 ] || fail "no project-oncall.yaml (AppProject oncall) found"
          for p in "${projects[@]}"; do
            [ "$(yq '.metadata.name' "$p")" = "oncall" ] || fail "${p}: AppProject must be named oncall"
            [ "$(yq '.spec.sourceRepos | length' "$p")" -eq 1 ] || fail "${p}: sourceRepos must list exactly one repo"
            [ "$(yq '.spec.sourceRepos[0]' "$p")" = "https://github.com/Sandeep-RN/oci-k8s-gitops-demo-gitops.git" ] || fail "${p}: sourceRepos must be this repo only"
            [ "$(yq '.spec.destinations | length' "$p")" -eq 1 ] || fail "${p}: destinations must list exactly one entry"
            [ "$(yq '.spec.destinations[0].namespace' "$p")" = "$ns" ] || fail "${p}: destination namespace must be ${ns}"
            [ "$(yq '.spec.destinations[0].server' "$p")" = "https://kubernetes.default.svc" ] || fail "${p}: destination server must be the local cluster"
            [ "$(yq '(.spec.clusterResourceWhitelist // []) | length' "$p")" -eq 0 ] || fail "${p}: no cluster-scoped kind may be whitelisted"
            for kind in ResourceQuota LimitRange; do
              [ -n "$(yq ".spec.namespaceResourceBlacklist[]? | select(.group == \"\" and .kind == \"${kind}\") | .kind" "$p")" ] || fail "${p}: ${kind} must be in namespaceResourceBlacklist"
            done
          done

          # Every Application in project oncall stays in the tenant's namespace and
          # ships none of the objects that set its own cap.
          for app in argocd/clusters/*/apps/*.yaml; do
            [ "$(yq 'select(.kind == "Application") | .spec.project' "$app")" = "oncall" ] || continue
            [ "$(yq '.spec.destination.namespace' "$app")" = "$ns" ] || fail "${app}: a project-oncall Application must deploy into ${ns}"
            tenant=$(kubectl kustomize "$(yq '.spec.source.path' "$app")")
            bad=$(yq 'select(.kind == "ResourceQuota" or .kind == "LimitRange" or .kind == "PriorityClass" or .kind == "Namespace") | .kind + "/" + .metadata.name' <<<"$tenant")
            [ -z "$bad" ] || fail "${app}: the tenant's folder must not ship its own guardrails: ${bad}"
          done
          # The platform's own Application is the only one that may carry them, and
          # it must not run in the tenant's project (that would let it be loosened).
          [ "$(yq '.spec.project' argocd/clusters/k3s/apps/oncall-assistant-guardrails.yaml)" = "default" ] || fail "oncall-assistant-guardrails must be in project default"
          echo "ok"

      # ADR 0025, demo #195: the tenant's own workloads. The quota refuses what
      # does not fit only when a pod is created, which on this node means a
      # rollout that hangs or a nightly Job that never starts. These checks
      # catch it at review time instead:
      #   - every container: memory request = limit, CPU request < limit (so
      #     the pod is Burstable, never Guaranteed), the tenant's PriorityClass,
      #     no service-account token;
      #   - the BUDGET: the memory and CPU limits of every pod, all running at
      #     once, fit the platform's quota (read from the platform folder);
      #   - no surge pods: one replica with Recreate, CronJobs with Forbid;
      #   - images pinned (the app by its git SHA tag, others by digest);
      #   - least privilege: each database credential is referenced only by the
      #     workloads that need it (admin: Postgres and the role Job);
      #   - the four strict-scoped SealedSecrets with their keys.
      - name: Assert oncall-assistant workloads (ADR 0025)
        run: |
          set -euo pipefail
          shopt -s nullglob
          # stderr, so a failure inside $(...) is still printed.
          fail() { echo "FAIL: $*" >&2; exit 1; }
          ns=oncall-assistant
          # Quantities in the forms these manifests use; anything else fails
          # loudly rather than being compared wrongly.
          mi() { case "$1" in *Gi) echo $(( ${1%Gi} * 1024 )) ;; *Mi) echo "${1%Mi}" ;; *) fail "memory '$1': use Mi or Gi" ;; esac; }
          mc() { case "$1" in *m) echo "${1%m}" ;; ''|*[!0-9]*) fail "CPU '$1': use whole cores or millicores" ;; *) echo $(( $1 * 1000 )) ;; esac; }

          guard=$(kubectl kustomize platform/oncall-assistant-guardrails)
          q='select(.kind == "ResourceQuota") | .spec.hard'
          quota_mem=$(mi "$(yq "${q}[\"limits.memory\"]" <<<"$guard")")
          quota_cpu=$(mc "$(yq "${q}[\"limits.cpu\"]" <<<"$guard")")
          max_mem=$(mi "$(yq 'select(.kind == "LimitRange") | .spec.limits[] | select(.type == "Container") | .max.memory' <<<"$guard")")

          apps=()
          for app in argocd/clusters/*/apps/*.yaml; do
            [ "$(yq 'select(.kind == "Application") | .spec.project' "$app")" = "oncall" ] && apps+=("$app")
          done
          [ ${#apps[@]} -gt 0 ] || fail "no Application in project oncall"
          for app in "${apps[@]}"; do
            path=$(yq '.spec.source.path' "$app")
            echo "::group::${path}"
            out=$(kubectl kustomize "$path")
            # One row per container: workload, container, the four quantities,
            # PriorityClass, token automount, image, Secrets the pod references.
            # -N: no "---" lines between results from different documents.
            rows=$(yq -N '
              select(.kind == "Deployment" or .kind == "StatefulSet" or .kind == "Job" or .kind == "CronJob")
              | (.kind + "/" + .metadata.name) as $id
              | (.spec.jobTemplate.spec.template.spec // .spec.template.spec) as $p
              | ([$p | .. | select(tag == "!!map") | (.secretKeyRef.name // .secretRef.name // .secret.secretName // "")] | map(select(. != "")) | unique | join(",")) as $secrets
              | (($p.initContainers // []) + $p.containers) | .[]
              | [$id, .name,
                 .resources.requests.memory // "-", .resources.limits.memory // "-",
                 .resources.requests.cpu // "-", .resources.limits.cpu // "-",
                 $p.priorityClassName // "-",
                 ($p.automountServiceAccountToken | tostring),
                 .image, $secrets] | @tsv' <<<"$out")
            # @tsv prints an empty line for each object that is not a workload.
            rows=$(grep -v '^$' <<<"$rows" || true)
            [ -n "$rows" ] || fail "${path}: no workloads"
            sum_mem=0; sum_cpu=0
            while IFS=$'\t' read -r id c mreq mlim creq clim pc am image secrets; do
              where="${path}: ${id} container ${c}"
              for v in "$mreq" "$mlim" "$creq" "$clim"; do
                [ "$v" != "-" ] || fail "${where}: needs memory and CPU requests and limits"
              done
              mr=$(mi "$mreq"); ml=$(mi "$mlim"); cr=$(mc "$creq"); cl=$(mc "$clim")
              [ "$mr" -eq "$ml" ] || fail "${where}: memory request (${mreq}) must equal the limit (${mlim})"
              [ "$cr" -lt "$cl" ] || fail "${where}: CPU request (${creq}) must be below the limit (${clim}), or the pod could be Guaranteed"
              [ "$ml" -le "$max_mem" ] || fail "${where}: memory ${mlim} is above the LimitRange max"
              [ "$pc" = "oncall-assistant-low" ] || fail "${where}: priorityClassName must be oncall-assistant-low"
              [ "$am" = "false" ] || fail "${where}: automountServiceAccountToken must be false"
              grep -qE '^ghcr\.io/sandeep-rn/oncall-assistant:[0-9a-f]{40}$|@sha256:[0-9a-f]{64}$' <<<"$image" || fail "${where}: image ${image} is not pinned (git SHA tag or digest)"
              sum_mem=$(( sum_mem + ml )); sum_cpu=$(( sum_cpu + cl ))
              # Which workload may hold which credential.
              for s in ${secrets//,/ }; do
                case "${s}=${id}" in
                  postgres-credentials=StatefulSet/postgres | postgres-credentials=Job/oncall-db-roles) ;;
                  postgres-indexer-credentials=CronJob/index | postgres-indexer-credentials=Job/oncall-db-roles) ;;
                  postgres-app-credentials=Deployment/app | postgres-app-credentials=Job/oncall-db-roles) ;;
                  groq-api-key=Deployment/app) ;;
                  demo-tokens=Deployment/app) ;;
                  *) fail "${where}: ${id} must not reference Secret ${s}" ;;
                esac
              done
            done <<<"$rows"
            # Every pod at once (ADR 0025: the budget fits the cap at peak).
            echo "budget: memory ${sum_mem}Mi of ${quota_mem}Mi, CPU ${sum_cpu}m of ${quota_cpu}m"
            [ "$sum_mem" -le "$quota_mem" ] || fail "${path}: memory limits add up to ${sum_mem}Mi, over the ${quota_mem}Mi quota"
            [ "$sum_cpu" -le "$quota_cpu" ] || fail "${path}: CPU limits add up to ${sum_cpu}m, over the ${quota_cpu}m quota"
            # The app and the index use their own roles, never the admin.
            grep -qP '^Deployment/app\t.*[\t,]postgres-app-credentials(,|$)' <<<"$rows" || fail "${path}: Deployment/app does not use postgres-app-credentials"
            grep -qP '^CronJob/index\t.*[\t,]postgres-indexer-credentials(,|$)' <<<"$rows" || fail "${path}: CronJob/index does not use postgres-indexer-credentials"
            # glibc arenas (app ADR 0001): part of the measured memory budget.
            for w in 'Deployment app .spec.template.spec' 'CronJob index .spec.jobTemplate.spec.template.spec'; do
              read -r kind name spec <<<"$w"
              [ "$(yq "select(.kind == \"${kind}\" and .metadata.name == \"${name}\") | ${spec}.containers[0].env[] | select(.name == \"MALLOC_ARENA_MAX\") | .value" <<<"$out")" = "2" ] || fail "${path}: ${kind}/${name} must set MALLOC_ARENA_MAX=2"
            done

            # No surge pods: a rollout or a second Job would be refused by the full quota.
            while read -r name replicas strategy; do
              [ -n "$name" ] || continue
              [ "$replicas" = "1" ] || fail "${path}: Deployment/${name} must run 1 replica"
              [ "$strategy" = "Recreate" ] || fail "${path}: Deployment/${name} must use strategy Recreate"
            done < <(yq -N 'select(.kind == "Deployment") | .metadata.name + " " + (.spec.replicas // 1 | tostring) + " " + (.spec.strategy.type // "RollingUpdate")' <<<"$out")
            while read -r name policy; do
              [ -n "$name" ] || continue
              [ "$policy" = "Forbid" ] || fail "${path}: CronJob/${name} must use concurrencyPolicy Forbid"
            done < <(yq -N 'select(.kind == "CronJob") | .metadata.name + " " + (.spec.concurrencyPolicy // "Allow")' <<<"$out")

            # The Ingress is the only way in.
            exposed=$(yq -N 'select(.kind == "Service" and (.spec.type == "LoadBalancer" or .spec.type == "NodePort")) | .metadata.name' <<<"$out")
            [ -z "$exposed" ] || fail "${path}: Service bypasses the Ingress: ${exposed}"

            # The Secrets, sealed with strict scope into this namespace.
            for pair in postgres-credentials=username,password postgres-indexer-credentials=username,password postgres-app-credentials=username,password groq-api-key=GROQ_API_KEY; do
              name="${pair%%=*}"
              sealed=$(yq "select(.kind == \"SealedSecret\" and .metadata.name == \"${name}\")" <<<"$out")
              [ -n "$sealed" ] || fail "${path}: no SealedSecret ${name}"
              [ "$(yq '.metadata.namespace' <<<"$sealed")" = "$ns" ] || fail "${path}: SealedSecret ${name} is not in namespace ${ns}"
              if grep -qE 'sealedsecrets\.bitnami\.com/(cluster|namespace)-wide: "?true' <<<"$sealed"; then
                fail "${path}: ${name} must be sealed with --scope strict"
              fi
              keys="${pair#*=}"
              for k in ${keys//,/ }; do
                [ -n "$(yq ".spec.encryptedData[\"${k}\"] // \"\"" <<<"$sealed")" ] || fail "${path}: SealedSecret ${name} has no key ${k}"
              done
            done
            echo "ok"
            echo "::endgroup::"
          done

      # ADR 0003: the daily LLM budget's settings and the demo tokens (demo #207,
      # app issue #6). The settings are integers the app can parse. Demo tokens
      # reach ONLY the app, as an OPTIONAL read-only mount (the app has to start
      # before the first token is sealed), holding hashes, never tokens. When the
      # demo-tokens SealedSecret exists it is strict-scoped to this namespace and
      # every key is a valid token name (the name is logged and is a file name).
      - name: Assert oncall-assistant budget settings and demo tokens (ADR 0003)
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $*" >&2; exit 1; }
          ns=oncall-assistant
          apps=()
          for app in argocd/clusters/*/apps/*.yaml; do
            [ "$(yq 'select(.kind == "Application") | .spec.project' "$app")" = "oncall" ] && apps+=("$app")
          done
          [ ${#apps[@]} -gt 0 ] || fail "no Application in project oncall"
          for app in "${apps[@]}"; do
            path=$(yq '.spec.source.path' "$app")
            echo "::group::${path}"
            out=$(kubectl kustomize "$path")

            cm='select(.kind == "ConfigMap" and .metadata.name == "app-config") | .data'
            total=$(yq "${cm}.DAILY_TOKENS_TOTAL // \"\"" <<<"$out")
            pct=$(yq "${cm}.PUBLIC_SHARE_PCT // \"\"" <<<"$out")
            [[ "$total" =~ ^[1-9][0-9]*$ ]] || fail "${path}: app-config DAILY_TOKENS_TOTAL must be a positive integer, got '${total}'"
            { [[ "$pct" =~ ^[0-9]+$ ]] && [ "$pct" -ge 1 ] && [ "$pct" -le 100 ]; } || fail "${path}: app-config PUBLIC_SHARE_PCT must be an integer from 1 to 100, got '${pct}'"

            dep='select(.kind == "Deployment" and .metadata.name == "app") | .spec.template.spec'
            vol="${dep}.volumes[] | select(.name == \"demo-tokens\")"
            [ "$(yq "${vol} | .secret.secretName" <<<"$out")" = "demo-tokens" ] || fail "${path}: Deployment/app must mount Secret demo-tokens as volume demo-tokens"
            [ "$(yq "${vol} | .secret.optional" <<<"$out")" = "true" ] || fail "${path}: the demo-tokens volume must be optional: the app has to start before the first token is sealed"
            # 0440, rendered in decimal; fsGroup lets the app user read it.
            [ "$(yq "${vol} | .secret.defaultMode" <<<"$out")" = "288" ] || fail "${path}: the demo-tokens volume must have defaultMode 0440"
            [ "$(yq "${dep}.securityContext.fsGroup" <<<"$out")" = "10001" ] || fail "${path}: Deployment/app needs fsGroup 10001 to read the 0440 token files"
            mount=$(yq "${dep}.containers[0].volumeMounts[] | select(.name == \"demo-tokens\") | .mountPath + \" \" + (.readOnly | tostring)" <<<"$out")
            [ "$mount" = "/run/demo-tokens true" ] || fail "${path}: demo-tokens must be mounted read-only at /run/demo-tokens, got '${mount}'"
            [ "$(yq "${dep}.containers[0].env[] | select(.name == \"DEMO_TOKEN_DIR\") | .value" <<<"$out")" = "/run/demo-tokens" ] || fail "${path}: DEMO_TOKEN_DIR must point at the mount, /run/demo-tokens"

            # Only the app may reference demo-tokens (the workloads step enforces
            # which workload may hold which Secret); here: not through env vars.
            # Real values, not a string literal: yq prints a literal once per
            # document even when nothing matched. Captured first, so a grep that
            # stops early cannot turn into a SIGPIPE failure under pipefail.
            envrefs=$(yq -N '.. | select(tag == "!!map") | (.secretKeyRef.name, .secretRef.name)' <<<"$out")
            if grep -q '^demo-tokens$' <<<"$envrefs"; then
              fail "${path}: demo-tokens must be mounted as files, not read through env vars (they would show in the process environment)"
            fi

            sealed=$(yq 'select(.kind == "SealedSecret" and .metadata.name == "demo-tokens")' <<<"$out")
            if [ -z "$sealed" ]; then
              echo "no demo tokens sealed yet: only the public budget exists"
            else
              [ "$(yq '.metadata.namespace' <<<"$sealed")" = "$ns" ] || fail "${path}: SealedSecret demo-tokens is not in namespace ${ns}"
              if grep -qE 'sealedsecrets\.bitnami\.com/(cluster|namespace)-wide: "?true' <<<"$sealed"; then
                fail "${path}: demo-tokens must be sealed with --scope strict"
              fi
              keys=$(yq '.spec.encryptedData | keys | .[]' <<<"$sealed")
              [ -n "$keys" ] || fail "${path}: SealedSecret demo-tokens has no tokens"
              while read -r k; do
                [[ "$k" =~ ^[a-z0-9][a-z0-9-]{0,30}$ ]] || fail "${path}: demo token name '${k}' must be lowercase letters, digits and '-', 1 to 31 characters"
              done <<<"$keys"
              echo "demo tokens sealed: $(wc -l <<<"$keys")"
            fi
            echo "ok"
            echo "::endgroup::"
          done

      # ADR 0003: the assistant's role SQL, run on the SAME pgvector image the
      # cluster uses (read from the role Job): what each role may do is proved by
      # trying it, twice over, not read off the SQL. About a minute.
      - name: Test oncall-assistant role SQL on a real Postgres (ADR 0003)
        run: scripts/test-oncall-roles.sh

      # ADR 0020 and 0025: ask.sandeeprn.in. Same edge rules as the link
      # shortener's host (production issuer, DNS only, HSTS pinned, no
      # defaultBackend, every host covered by TLS, every path to the app), plus:
      # /ask has its own Ingress with the tight per-client limit and the body
      # cap, every other Ingress has the general limit, and exactly one Ingress
      # asks cert-manager for the certificate that all of them share.
      - name: Assert oncall-assistant Ingress and rate limits (ADR 0025)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "FAIL: $*" >&2; exit 1; }
          apps=()
          for app in argocd/clusters/*/apps/*.yaml; do
            [ "$(yq 'select(.kind == "Application") | .spec.project' "$app")" = "oncall" ] && apps+=("$app")
          done
          [ ${#apps[@]} -gt 0 ] || fail "no Application in project oncall"
          for app in "${apps[@]}"; do
            path=$(yq '.spec.source.path' "$app")
            echo "::group::${path}"
            out=$(kubectl kustomize "$path")
            # -N: no "---" lines between results from different documents.
            names=$(yq -N 'select(.kind == "Ingress") | .metadata.name' <<<"$out")
            [ -n "$names" ] || fail "${path}: no Ingress"
            mw() { yq "select(.kind == \"Middleware\" and .metadata.name == \"$1\")" <<<"$out"; }
            ref() { echo "$(yq '.metadata.namespace' <<<"$(mw "$1")")-$1@kubernetescrd"; }
            for m in rate-limit ask-rate-limit ask-body-limit hsts; do
              [ -n "$(mw "$m")" ] || fail "${path}: no ${m} Middleware"
            done
            [ "$(yq '.spec.rateLimit.average // 0' <<<"$(mw rate-limit)")" -gt 0 ] || fail "${path}: rate-limit has no average"
            [ "$(yq '.spec.rateLimit.burst // 0' <<<"$(mw rate-limit)")" -gt 0 ] || fail "${path}: rate-limit has no burst"
            # Pinned: each live answer spends the shared free tier (about 3 a
            # minute for everyone). Loosening it is a decision, not a typo.
            ask=$(mw ask-rate-limit)
            [ "$(yq '.spec.rateLimit.average' <<<"$ask")/$(yq '.spec.rateLimit.period' <<<"$ask")/$(yq '.spec.rateLimit.burst' <<<"$ask")" = "2/1m/3" ] || fail "${path}: ask-rate-limit must be average 2, period 1m, burst 3"
            body=$(yq '.spec.buffering.maxRequestBodyBytes // 0' <<<"$(mw ask-body-limit)")
            [ "$body" -gt 0 ] && [ "$body" -le 65536 ] || fail "${path}: ask-body-limit must cap the body (0 < maxRequestBodyBytes <= 65536)"
            hsts=$(mw hsts)
            [ "$(yq '.spec.headers.stsSeconds' <<<"$hsts")" = "15552000" ] || fail "${path}: hsts max-age is not 15552000 (180 days)"
            [ "$(yq '.spec.headers.stsIncludeSubdomains // false' <<<"$hsts")" = "false" ] || fail "${path}: hsts must not include subdomains"
            [ "$(yq '.spec.headers.stsPreload // false' <<<"$hsts")" = "false" ] || fail "${path}: hsts must not ask for preload"

            issuers=0; ask_routes=0; secrets=""
            for name in $names; do
              ing="select(.kind == \"Ingress\" and .metadata.name == \"${name}\")"
              a() { yq "${ing} | .metadata.annotations[\"$1\"] // \"\"" <<<"$out"; }
              has_mw() { tr ',' '\n' <<<"$(a traefik.ingress.kubernetes.io/router.middlewares)" | tr -d ' ' | grep -qFx -- "$(ref "$1")"; }
              [ "$(yq "${ing} | .spec.ingressClassName" <<<"$out")" = "traefik" ] || fail "${name}: ingressClassName is not traefik"
              [ "$(a traefik.ingress.kubernetes.io/router.entrypoints)" = "websecure" ] || fail "${name}: must use the websecure entrypoint only"
              [ "$(a external-dns.alpha.kubernetes.io/cloudflare-proxied)" = "false" ] || fail "${name}: must be DNS only (cloudflare-proxied \"false\")"
              has_mw hsts || fail "${name}: hsts Middleware is not attached"
              [ "$(yq "${ing} | .spec.rules | length" <<<"$out")" -gt 0 ] || fail "${name}: no rules"
              [ "$(yq "${ing} | .spec | has(\"defaultBackend\")" <<<"$out")" = "false" ] || fail "${name}: defaultBackend bypasses the host rules"
              for host in $(yq "${ing} | .spec.rules[].host" <<<"$out"); do
                s=$(yq "${ing} | .spec.tls[]? | select(.hosts[]? == \"${host}\") | .secretName" <<<"$out")
                [ -n "$s" ] || fail "${name}: ${host} has no TLS Secret"
                secrets+="${s}"$'\n'
              done
              [ -z "$(yq "${ing} | .spec.rules[].http.paths[] | select(.backend.service.name != \"app\") | .path" <<<"$out")" ] || fail "${name}: a path does not go to the app Service"
              issuer=$(a cert-manager.io/cluster-issuer)
              if [ -n "$issuer" ]; then
                [ "$issuer" = "letsencrypt-production" ] || fail "${name}: not issued by letsencrypt-production"
                issuers=$((issuers + 1))
              fi
              # An Ingress that routes /ask carries the tight limit and the body
              # cap, and routes nothing else (its limit would starve the page).
              paths=$(yq "${ing} | .spec.rules[].http.paths[] | .path + \" \" + .pathType" <<<"$out")
              if grep -q '^/ask ' <<<"$paths"; then
                [ "$paths" = "/ask Exact" ] || fail "${name}: the /ask Ingress must route only /ask (Exact), got: ${paths//$'\n'/; }"
                has_mw ask-rate-limit || fail "${name}: ask-rate-limit is not attached"
                has_mw ask-body-limit || fail "${name}: ask-body-limit is not attached"
                # Traefik ranks routers by rule length unless a priority is set,
                # and PathPrefix(`/`) is longer than Path(`/ask`): without this
                # the "/" router serves /ask with neither middleware (demo #195).
                prio=$(a traefik.ingress.kubernetes.io/router.priority)
                [[ "$prio" =~ ^[0-9]+$ ]] && [ "$prio" -ge 100 ] || fail "${name}: the /ask Ingress needs traefik.ingress.kubernetes.io/router.priority >= 100, or the \"/\" router (a longer rule) takes /ask"
                ask_routes=$((ask_routes + 1))
              else
                has_mw rate-limit || fail "${name}: rate-limit is not attached"
                [ -z "$(a traefik.ingress.kubernetes.io/router.priority)" ] || fail "${name}: only the /ask Ingress may set a router priority"
              fi
            done
            [ "$ask_routes" -ge 1 ] || fail "${path}: no Ingress routes /ask, so it would fall through to the general limit"
            [ "$issuers" -eq 1 ] || fail "${path}: exactly one Ingress may carry cert-manager.io/cluster-issuer (found ${issuers}); two would fight over one Secret"
            [ "$(sort -u <<<"${secrets%$'\n'}" | wc -l)" -eq 1 ] || fail "${path}: all Ingresses must share one TLS Secret"
            echo "ok"
            echo "::endgroup::"
          done

      # ADR 0020: in every deployed link-shortener overlay, the backend reads its
      # link-creation tokens from the link-tokens Secret, mounted whole (a
      # subPath mount never sees a rotation or revocation) at the directory the
      # app is told to read. The overlay must ship that Secret as a strict-scoped
      # SealedSecret: the volume is not optional, so without it new pods never
      # start (old ones keep serving, but the rollout stalls).
      - name: Assert link-token wiring (ADR 0020)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "FAIL: $*"; exit 1; }
          apps=(argocd/clusters/*/apps/link-shortener.yaml)
          [ ${#apps[@]} -gt 0 ] || fail "no link-shortener Application found"
          for app in "${apps[@]}"; do
            path=$(yq '.spec.source.path' "$app")
            echo "::group::${path}"
            out=$(kubectl kustomize "$path")
            pod_spec='select(.kind == "Deployment" and .metadata.name == "backend") | .spec.template.spec'
            # One name per line; documents that do not match print nothing.
            vol=$(yq "${pod_spec} | .volumes[]? | select(.secret.secretName == \"link-tokens\") | .name" <<<"$out")
            [ -n "$vol" ] || fail "${path}: backend has no volume from Secret link-tokens"
            [ "$(wc -l <<<"$vol")" -eq 1 ] || fail "${path}: more than one link-tokens volume"
            [ "$(yq "${pod_spec} | .volumes[] | select(.name == \"${vol}\") | .secret.optional // false" <<<"$out")" = "false" ] || fail "${path}: link-tokens volume must not be optional"
            container="${pod_spec} | .containers[] | select(.name == \"backend\")"
            token_mount="${container} | .volumeMounts[]? | select(.name == \"${vol}\")"
            mount=$(yq "${token_mount} | .mountPath" <<<"$out")
            [ -n "$mount" ] || fail "${path}: link-tokens volume is not mounted in the backend container"
            [ -z "$(yq "${token_mount} | .subPath // \"\"" <<<"$out")" ] || fail "${path}: subPath mount never sees token updates"
            [ "$(yq "${container} | .env[]? | select(.name == \"LINK_TOKENS_DIR\") | .value" <<<"$out")" = "$mount" ] || fail "${path}: LINK_TOKENS_DIR is not the mount path"
            [ "$(yq "${container} | .env[]? | select(.name == \"LINK_CREATE_MODE\") | .value" <<<"$out")" = "token" ] || fail "${path}: LINK_CREATE_MODE is not token"
            sealed=$(yq 'select(.kind == "SealedSecret" and .metadata.name == "link-tokens")' <<<"$out")
            [ -n "$sealed" ] || fail "${path}: no link-tokens SealedSecret"
            # Strict scope binds the ciphertext to this namespace; any other one
            # (say, from a kustomize namespace change) makes it undecryptable.
            [ "$(yq '.metadata.namespace' <<<"$sealed")" = "link-shortener" ] || fail "${path}: link-tokens is not in namespace link-shortener"
            [ "$(yq '.spec.encryptedData | length' <<<"$sealed")" -gt 0 ] || fail "${path}: link-tokens holds no tokens"
            # Strict scope: no annotation may widen it to the namespace or cluster.
            if grep -qE 'sealedsecrets\.bitnami\.com/(cluster|namespace)-wide: "?true' <<<"$sealed"; then
              fail "${path}: link-tokens must be sealed with --scope strict"
            fi
            echo "ok"
            echo "::endgroup::"
          done

      # ADR 0020: external-dns manages only sandeeprn.in records it owns, only
      # from Ingresses, DNS only (never proxied). The owner id and TXT prefix
      # are pinned per cluster: changing either after deployment orphans the
      # live records, because the new identity does not own them, so `sync`
      # neither updates nor deletes them.
      - name: Assert external-dns settings (ADR 0020)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "FAIL: $*"; exit 1; }
          files=(rendered/*-external-dns.yaml)
          [ ${#files[@]} -gt 0 ] || fail "no rendered external-dns app found"
          for f in "${files[@]}"; do
            echo "::group::${f}"
            cluster=$(basename "$f" -external-dns.yaml)
            # Never change these for a running cluster (see above).
            case "$cluster" in
              k3s) owner=oci-demo-k3s ;;
              *) fail "${f}: no pinned TXT owner id for cluster ${cluster}" ;;
            esac
            container='select(.kind == "Deployment" and .metadata.name == "external-dns") | .spec.template.spec.containers[] | select(.name == "external-dns")'
            args=$(yq "${container} | .args[]" "$f")
            # Fixed strings: the dot in sandeeprn.in must not match any character.
            has() { grep -qFx -- "$1" <<<"$args" || fail "${f}: missing $1"; }
            only() { [ "$(grep -c -- "^$1=" <<<"$args")" -eq 1 ] || fail "${f}: more than one $1"; }
            has --provider=cloudflare
            has --source=ingress
            only --source
            has --domain-filter=sandeeprn.in
            only --domain-filter
            has --policy=sync
            has --registry=txt
            has "--txt-owner-id=${owner}"
            has --txt-prefix=edns-
            # Private addresses must never reach public DNS: a guard against a
            # wrongly sealed node address (ADR 0022).
            has --exclude-target-net=10.0.0.0/8
            has --exclude-target-net=172.16.0.0/12
            has --exclude-target-net=192.168.0.0/16
            # DNS only: the global flag must be off (Ingresses are checked below).
            if grep -q -- '^--cloudflare-proxied' <<<"$args"; then fail "${f}: records must be DNS only"; fi
            [ "$(yq "${container} | .env[]? | select(.name == \"CF_API_TOKEN\") | .valueFrom.secretKeyRef.name" "$f")" = "cloudflare-api-token" ] || fail "${f}: CF_API_TOKEN is not from Secret cloudflare-api-token"
            echo "ok"
            echo "::endgroup::"
          done
          # Chart version must be an exact X.Y.Z, never a range or "latest".
          for app in argocd/clusters/*/apps/external-dns.yaml; do
            v=$(yq '.spec.sources[] | select(.chart == "external-dns") | .targetRevision' "$app")
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "${app}: chart version '${v}' is not pinned"
          done

      # ADR 0020: every Ingress of a deployed link-shortener overlay is served by
      # Traefik over TLS from a Let's Encrypt issuer, is not proxied by
      # Cloudflare, sends everything to the backend Service, and goes through
      # the rate-limit Middleware shipped in the same overlay.
      - name: Assert app Ingress and rate limit (ADR 0020)
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "FAIL: $*"; exit 1; }
          apps=(argocd/clusters/*/apps/link-shortener.yaml)
          [ ${#apps[@]} -gt 0 ] || fail "no link-shortener Application found"
          for app in "${apps[@]}"; do
            path=$(yq '.spec.source.path' "$app")
            echo "::group::${path}"
            out=$(kubectl kustomize "$path")
            names=$(yq 'select(.kind == "Ingress") | .metadata.name' <<<"$out")
            [ -n "$names" ] || fail "${path}: no Ingress"
            # The Ingress is the only way in (demo #91). A LoadBalancer Service here
            # would add a second public address that skips TLS, HSTS and the rate
            # limit.
            lbs=$(yq 'select(.kind == "Service" and .spec.type == "LoadBalancer") | .metadata.name' <<<"$out")
            [ -z "$lbs" ] || fail "${path}: LoadBalancer Service bypasses the Ingress: ${lbs}"
            mw=$(yq 'select(.kind == "Middleware" and .metadata.name == "rate-limit")' <<<"$out")
            [ -n "$mw" ] || fail "${path}: no rate-limit Middleware"
            [ "$(yq '.spec.rateLimit.average // 0' <<<"$mw")" -gt 0 ] || fail "${path}: rate-limit has no average"
            [ "$(yq '.spec.rateLimit.burst // 0' <<<"$mw")" -gt 0 ] || fail "${path}: rate-limit has no burst"
            # Traefik's name for a CRD Middleware: <namespace>-<name>@kubernetescrd.
            ref="$(yq '.metadata.namespace' <<<"$mw")-rate-limit@kubernetescrd"
            # HSTS: browsers keep it for max-age and it cannot be withdrawn
            # early, so it covers this host only (ADR 0020, demo #90). The
            # max-age must match scripts/verify-public-url.sh in the demo repo.
            hsts=$(yq 'select(.kind == "Middleware" and .metadata.name == "hsts")' <<<"$out")
            [ -n "$hsts" ] || fail "${path}: no hsts Middleware"
            [ "$(yq '.spec.headers.stsSeconds' <<<"$hsts")" = "15552000" ] || fail "${path}: hsts max-age is not 15552000 (180 days)"
            [ "$(yq '.spec.headers.stsIncludeSubdomains // false' <<<"$hsts")" = "false" ] || fail "${path}: hsts must not include subdomains"
            [ "$(yq '.spec.headers.stsPreload // false' <<<"$hsts")" = "false" ] || fail "${path}: hsts must not ask for preload"
            hsts_ref="$(yq '.metadata.namespace' <<<"$hsts")-hsts@kubernetescrd"
            for name in $names; do
              ing="select(.kind == \"Ingress\" and .metadata.name == \"${name}\")"
              a() { yq "${ing} | .metadata.annotations[\"$1\"] // \"\"" <<<"$out"; }
              [ "$(yq "${ing} | .spec.ingressClassName" <<<"$out")" = "traefik" ] || fail "${name}: ingressClassName is not traefik"
              tr ',' '\n' <<<"$(a traefik.ingress.kubernetes.io/router.middlewares)" | tr -d ' ' | grep -qFx -- "$ref" || fail "${name}: rate-limit Middleware (${ref}) is not attached"
              tr ',' '\n' <<<"$(a traefik.ingress.kubernetes.io/router.middlewares)" | tr -d ' ' | grep -qFx -- "$hsts_ref" || fail "${name}: hsts Middleware (${hsts_ref}) is not attached"
              # Production only: a staging certificate is not browser-trusted,
              # and HSTS on an untrusted certificate locks visitors out (demo #90).
              [ "$(a cert-manager.io/cluster-issuer)" = "letsencrypt-production" ] || fail "${name}: not issued by letsencrypt-production"
              [ "$(a external-dns.alpha.kubernetes.io/cloudflare-proxied)" = "false" ] || fail "${name}: must be DNS only (cloudflare-proxied \"false\")"
              # The loops below would pass on zero rules, and a defaultBackend
              # would route around them: require rules, forbid defaultBackend.
              [ "$(yq "${ing} | .spec.rules | length" <<<"$out")" -gt 0 ] || fail "${name}: no rules"
              [ "$(yq "${ing} | .spec | has(\"defaultBackend\")" <<<"$out")" = "false" ] || fail "${name}: defaultBackend bypasses the host rules"
              # Every rule host is covered by a TLS entry with a Secret.
              for host in $(yq "${ing} | .spec.rules[].host" <<<"$out"); do
                [ -n "$(yq "${ing} | .spec.tls[]? | select(.hosts[]? == \"${host}\") | .secretName" <<<"$out")" ] || fail "${name}: ${host} has no TLS Secret"
              done
              [ -z "$(yq "${ing} | .spec.rules[].http.paths[] | select(.backend.service.name != \"backend\") | .path" <<<"$out")" ] || fail "${name}: a path does not go to the backend Service"
            done
            echo "ok"
            echo "::endgroup::"
          done

      - name: Reject plain Secrets
        run: |
          set -euo pipefail
          # Only SealedSecrets may be committed (ADR 0006).
          if grep -rEl --include='*.yaml' --include='*.yml' '^kind: Secret$' apps argocd monitoring platform edge 2>/dev/null; then
            echo "plain Secret manifest found; use a SealedSecret"; exit 1
          fi
