# Grafana admin login, encrypted for this cluster only (strict scope).
# Read it with: kubectl -n monitoring get secret grafana-admin -o jsonpath="{.data.admin-password}" | base64 -d
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
