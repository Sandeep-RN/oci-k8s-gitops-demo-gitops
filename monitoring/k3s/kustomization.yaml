apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Cluster-specific monitoring objects that are not part of the Helm chart.
# Deployed as the third source of argocd/clusters/k3s/apps/monitoring.yaml.
#
# Both SealedSecrets were sealed for the retired OKE target: k3s runs on its
# sealing keys, restored from the offline backup (ADR 0022), and the names and
# namespaces are unchanged, so the strict-scope ciphertext decrypts here without
# resealing. If either secret is rotated, reseal it with
# argocd/clusters/k3s/sealed-secrets-cert.pem.
namespace: monitoring
resources:
  - grafana-admin-sealedsecret.yaml
  # Discord webhook URL for Alertmanager (the channel OKE used too; alerts carry
  # the cluster external label, so the message shows which cluster paged).
  - alertmanager-discord-sealedsecret.yaml
  # Platform alerts and the cert-manager scrape they need (demo #140).
  - cert-manager-servicemonitor.yaml
  - platform-rules.yaml
