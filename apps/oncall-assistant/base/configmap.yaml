# Non-secret connection settings, shared by the app, the index CronJob and the
# role Job. Each pod adds its own PGUSER/PGPASSWORD from its own Secret, so no
# pod holds a role it does not need (three roles, see sql/roles.sql).
# The app reads the standard libpq variables because DATABASE_URL is left unset:
# a URL would have to carry the password inside a ConfigMap or a built string.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: oncall
  # Fail fast instead of hanging a request or an index run on a dead socket.
  PGCONNECT_TIMEOUT: "5"
  # The app's daily LLM budget (ADR 0003, app issue #6), counted in TOKENS
  # because the provider's free tier runs out of tokens (Groq: 200K a day)
  # long before it runs out of requests. TOTAL is the provider's daily
  # allowance; PCT is the share public visitors may use, the rest is for
  # demo-token holders. The provider's own limit stays the hard stop. Read by
  # the app only: the index and role Jobs ignore them. Integers, checked in CI.
  DAILY_TOKENS_TOTAL: "200000"
  PUBLIC_SHARE_PCT: "70"
