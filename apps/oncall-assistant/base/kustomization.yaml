apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Namespace itself, its ResourceQuota, LimitRange and the PriorityClass
# belong to the platform (platform/oncall-assistant-guardrails, ADR 0025); the
# tenant's project "oncall" may not create them, and CI checks this folder
# ships none of them.
namespace: oncall-assistant
resources:
  - configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - db-roles-job.yaml
  - deployment.yaml
  - service.yaml
  - index-cronjob.yaml
# SQL for the oncall-db-roles Job. The name hash changes with the file, and
# kustomize updates the Job's reference to match.
configMapGenerator:
  - name: oncall-db-roles-sql
    files:
      - sql/roles.sql
# The app repo's CI tag-bump PR changes newTag to the git SHA (it edits this
# exact file; path set in that repo's ci.yml). Do not edit it by hand. The same
# image runs the app and the index CronJob.
images:
  - name: ghcr.io/sandeep-rn/oncall-assistant
    newTag: 4aa3ff5b4ae356b4e0f755829fb80d56bd77cf20
