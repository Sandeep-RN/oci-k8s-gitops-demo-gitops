apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Single-node k3s on Always Free. Differences from base (Ingress, storage,
# Postgres) are added here as those pieces arrive.
# Before the first sync, add this cluster's SealedSecrets (sealed with the k3s
# controller's key): postgres-credentials, postgres-app-credentials and
# link-tokens. The backend's link-tokens volume is required, so without it new
# backend pods wait in ContainerCreating.
resources:
  - ../../base
