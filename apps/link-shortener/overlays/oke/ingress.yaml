# The public entry point: https://demo.sandeeprn.in through Traefik on the NLB
# (ADR 0020). From this one object:
#   - cert-manager issues the certificate into the TLS Secret (DNS-01),
#   - external-dns creates the A record (DNS only) and its TXT owner record,
#   - Traefik routes every path to the backend, behind the rate limit.
# Redirects stay public; link creation needs a token (the backend checks it).
#
# Namespaces are explicit: overlay resources do not get the base's namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: link-shortener
  annotations:
    # Production, after staging proved the setup (demo #88, #90). Changing the
    # issuer makes cert-manager reissue into the same Secret; the old
    # certificate keeps serving until the new one is ready. cert-manager renews
    # automatically 30 days before expiry (a third of Let's Encrypt's 90 days).
    cert-manager.io/cluster-issuer: letsencrypt-production
    # HTTPS only. Plain HTTP is redirected to HTTPS at Traefik's entrypoint.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Rate limit first, so rejected requests cost nothing more; then HSTS.
    traefik.ingress.kubernetes.io/router.middlewares: link-shortener-rate-limit@kubernetescrd,link-shortener-hsts@kubernetescrd
    # Explicitly DNS only (also external-dns's default): Cloudflare's proxy
    # would end TLS at Cloudflare instead of at our certificate (ADR 0020).
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - demo.sandeeprn.in
      secretName: demo-sandeeprn-in-tls
  rules:
    - host: demo.sandeeprn.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
