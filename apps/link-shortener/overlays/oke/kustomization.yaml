apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Short-lived multi-node OKE target (ADR 0015).
resources:
  - ../../base
  # Sealed with this cluster's key (strict scope: this name and namespace only).
  # Re-seal for another cluster; see argocd/clusters/oke/sealed-secrets-cert.pem.
  - postgres-credentials-sealedsecret.yaml
  # The backend's own role (ADR 0018); username linkshortener_app, random password.
  - postgres-app-credentials-sealedsecret.yaml
  # Named link-creation tokens (ADR 0020), mounted into the backend.
  # Add, rotate: scripts/seal-link-tokens.sh NAME... (see its header to revoke).
  - link-tokens-sealedsecret.yaml
  # No Ingress: https://demo.sandeeprn.in moved to k3s (ADR 0022, demo #8).
  # Removing the Ingress made ArgoCD prune it, and OKE's external-dns
  # (--policy=sync) then deleted the A record and its TXT owner record, so
  # k3s's external-dns could create its own. Never add it back here: both
  # clusters would claim the same hostname. The middlewares stay only so this
  # overlay still passes CI until the whole OKE target goes (#13).
  - rate-limit-middleware.yaml
  - hsts-middleware.yaml
# The backend Service stays ClusterIP from the base: with no Ingress, this
# cluster has no public way in (ADR 0020). Making it a LoadBalancer would
# create a public address that skips TLS, HSTS and the rate limit; CI rejects it.
patches:
  # Which cluster wrote a backup (object name link-shortener/<cluster>/<ts>.pgc),
  # so two clusters sharing one bucket cannot be confused or overwrite each
  # other (ADR 0022). Objects written before this change have no cluster part
  # (link-shortener/<ts>.pgc) and stay restorable under their old names.
  - target:
      kind: CronJob
      name: postgres-backup
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value:
          name: BACKUP_CLUSTER
          value: oke
  # The landing page's example link (demo #103). A short link is a row in this
  # cluster's database, so its code is per-cluster config. It is set on the
  # Deployment, not in app-config: the app reads it once at start, and a
  # changed pod template restarts the pods, while a ConfigMap-only change
  # would sit unused until someone restarted them. Public, not a secret.
  # Create the link first (POST /api/links with a token); an unknown code
  # still leaves the page working, with a link that answers 404.
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: EXAMPLE_LINK_CODE
          value: seYOHlz
  # Two nodes in different fault domains: require one pod per node, so a node
  # drain exercises the PDB for real (it cannot on single-node k3s, ADR 0001).
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
  # OKE has no default StorageClass. oci-bv is the block-volume CSI driver;
  # 50 GB is the smallest OCI block volume. Reclaim policy is Delete, but the
  # StatefulSet keeps its PVC when deleted, so teardown must delete the PVC
  # (otherwise the volume outlives `terraform destroy` and keeps billing).
  # volumeClaimTemplates are immutable: get this right before the first sync.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: oci-bv
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 50Gi
