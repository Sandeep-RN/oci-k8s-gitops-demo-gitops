apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  # One replica (ADR 0007): no failover target on a single node; data safety
  # comes from the nightly pg_dump backup (Phase 3), not replication.
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: link-shortener
    spec:
      automountServiceAccountToken: false
      # Long enough for a clean "smart" shutdown and checkpoint.
      terminationGracePeriodSeconds: 60
      securityContext:
        # UID/GID 70 is "postgres" in the Alpine image. The entrypoint works
        # without root when the data directory is writable by this user.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70 # makes the fresh volume group-writable for initdb
        fsGroupChangePolicy: OnRootMismatch # skip the recursive chown on every start
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: password }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: app-config, key: PGDATABASE }
            # Only used on first start (initdb). Changing the Secret later does
            # NOT change the password inside an existing database.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          # pg_isready over TCP: checks the server accepts connections, without a password.
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 60 # first start runs initdb; allow up to 5 min
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6 # 2 min: never kill Postgres for a brief stall
          volumeMounts:
            # Postgres 18 images keep PGDATA at /var/lib/postgresql/18/docker and
            # expect the volume at /var/lib/postgresql (not .../data as in <= 17).
            # The subdirectory also avoids initdb failing on a volume's lost+found.
            - name: data
              mountPath: /var/lib/postgresql
            # Writable scratch space, needed because the root filesystem is read-only.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  # Storage class and size are set per cluster in the overlays.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
