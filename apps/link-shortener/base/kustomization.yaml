apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: link-shortener
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - metrics-service.yaml
  - servicemonitor.yaml
  - redirect-probe.yaml
  - slo-rules.yaml
  - pdb.yaml
  - configmap.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - postgres-backup-cronjob.yaml
  - postgres-app-role-job.yaml
# The SLO dashboard as a ConfigMap. Grafana's sidecar loads every ConfigMap
# labelled grafana_dashboard=1, in any namespace. No name hash: nothing mounts
# it, so a changing name would only leave old copies behind.
configMapGenerator:
  - name: slo-redirect-dashboard
    files:
      - dashboards/slo-redirect.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  # SQL for the postgres-app-role Job. The name hash changes with the file,
  # and kustomize updates the Job's reference to match.
  - name: postgres-app-role-sql
    files:
      - sql/app-role.sql
# CI's tag-bump PR changes newTag to the git SHA. Do not edit it by hand.
images:
  - name: ghcr.io/sandeep-rn/oci-k8s-gitops-demo-app-backend
    newTag: e55084d9deb5a4fa3debe9f1352cb6c8de8f53e9
