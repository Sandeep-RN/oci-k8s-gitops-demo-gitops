# Headless: required by the StatefulSet for its stable DNS name. With one
# replica, "postgres" resolves straight to the pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
