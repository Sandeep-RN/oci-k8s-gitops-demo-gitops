# A separate Service for metrics only. The "backend" Service is what the public
# Ingress routes to; keeping the metrics port off it keeps /metrics unpublished.
apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: metrics
      port: 9000
      targetPort: metrics
