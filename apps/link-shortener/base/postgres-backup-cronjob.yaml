# Nightly logical backup of Postgres to Object Storage (ADR 0007, ADR 0017).
#   1. init container "dump": pg_dump (custom format) into a scratch volume,
#      using the same image as the server, so client and server versions match.
#   2. container "upload": OCI CLI with instance-principal auth puts the file
#      into the backup bucket under a timestamped name. The node's policy allows
#      only creating and listing objects there (no read, overwrite or delete).
# The Object Storage namespace identifies the tenancy, so it is looked up at
# run time instead of being committed. Old dumps expire by a lifecycle rule.
# Alert if no backup succeeds for 26 h: slo-rules.yaml (PostgresBackupMissing).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  # A missed run (for example the controller was down) still starts within an hour.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: link-shortener
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 1Gi
          initContainers:
            - name: dump
              image: docker.io/library/postgres:18.6-alpine
              securityContext:
                runAsUser: 70
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              envFrom:
                - configMapRef:
                    name: app-config
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef: { name: postgres-credentials, key: username }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: postgres-credentials, key: password }
              command: ["sh", "-ec"]
              args:
                - |
                  pg_dump --format=custom --no-owner --file=/work/dump.pgc
                  # Fail here rather than upload an empty or truncated file.
                  pg_restore --list /work/dump.pgc > /dev/null
                  echo "dump ok: $(wc -c < /work/dump.pgc) bytes"
              volumeMounts:
                - { name: work, mountPath: /work }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
          containers:
            - name: upload
              # Official OCI CLI image (amd64 + arm64), pinned by digest.
              image: ghcr.io/oracle/oci-cli:20261007@sha256:48884d8710d30356cac71c7aa678873a97c53c594fefdf2724c80270f3ca563b
              securityContext:
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - name: BUCKET
                  value: oci-k8s-gitops-demo-pg-backups
                - name: OCI_CLI_AUTH
                  value: instance_principal
                # The CLI may write small cache files under HOME; the root FS is read-only.
                - name: HOME
                  value: /work
              command: ["sh", "-ec"]
              args:
                - |
                  ns=$(oci os ns get --query data --raw-output)
                  name="link-shortener/$(date -u +%Y-%m-%dT%H%M%SZ).pgc"
                  # --no-overwrite: the policy forbids overwriting anyway; fail clearly if the name exists.
                  oci os object put --namespace-name "$ns" --bucket-name "$BUCKET" \
                    --name "$name" --file /work/dump.pgc --no-overwrite --no-multipart
                  echo "uploaded $name"
              volumeMounts:
                - { name: work, mountPath: /work }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
