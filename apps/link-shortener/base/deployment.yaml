apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  annotations:
    # After the postgres-app-role Job (wave 1), which creates the role it uses.
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Two replicas so a rolling update or one pod crash never means zero pods.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the desired count during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: link-shortener
    spec:
      automountServiceAccountToken: false # the app never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # matches the numeric UID in the app Dockerfile
        seccompProfile:
          type: RuntimeDefault
      # ScheduleAnyway: on the single k3s node both pods must still schedule.
      # The OKE overlay can tighten this to DoNotSchedule across nodes/zones.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
          # Count only pods of the same ReplicaSet. Without this, a rollout counts
          # old and new pods together: each new pod's placement is valid while the
          # old ones exist, and once they are gone both new pods can be left on one
          # node. Spread is never re-checked after placement. (Beta, on by default
          # since Kubernetes 1.27.)
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: backend
          # Tag is set in kustomization.yaml by the CI tag-bump PR (ADR 0009).
          image: ghcr.io/sandeep-rn/oci-k8s-gitops-demo-app-backend
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # The app's own role, not the admin (ADR 0018). The postgres-app-role
            # Job creates it before this Deployment syncs (wave 2).
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: postgres-app-credentials, key: username }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-app-credentials, key: password }
          ports:
            - name: http
              containerPort: 8000
            # Prometheus metrics (the app's METRICS_PORT default). Reached only
            # through the backend-metrics ClusterIP Service, never the LB.
            - name: metrics
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi } # no CPU limit: avoids throttling on a small node
          # Probe timeouts are explicit (the default is 1 s). During a database
          # outage /readyz answers 503 in up to ~1.5 s, and the kubelet must wait
          # long enough to read that 503 rather than record a timeout.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
