apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # Two replicas so a rolling update or one pod crash never means zero pods.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the desired count during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: link-shortener
    spec:
      automountServiceAccountToken: false # the app never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # matches the numeric UID in the app Dockerfile
        seccompProfile:
          type: RuntimeDefault
      # ScheduleAnyway: on the single k3s node both pods must still schedule.
      # The OKE overlay can tighten this to DoNotSchedule across nodes/zones.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      containers:
        - name: backend
          # Tag is set in kustomization.yaml by the CI tag-bump PR (ADR 0009).
          image: ghcr.io/sandeep-rn/oci-k8s-gitops-demo-app-backend
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi } # no CPU limit: avoids throttling on a small node
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
